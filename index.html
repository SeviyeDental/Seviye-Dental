<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seviye Dental - Ortak Saha Satış & CRM Sistemi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
    
    <!-- En Güncel Firebase Modülleri (Auth Dahil) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, doc, collection, query, onSnapshot, addDoc, updateDoc, deleteDoc, orderBy, where, getDocs } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        
        const firebaseConfig = {
            apiKey: "AIzaSyCJJP857pMmLoCc7CMzswHNwTp_TAybMdE",
            authDomain: "webapp-d239c.firebaseapp.com",
            projectId: "webapp-d239c",
            storageBucket: "webapp-d239c.firebasestorage.app",
            messagingSenderId: "965046349663",
            appId: "1:965046349663:web:dbdda634472521accad0ea"
        };

        const app = initializeApp(firebaseConfig);
        window.db = getFirestore(app);
        window.auth = getAuth(app);
        window.FirebaseMethods = { doc, collection, query, onSnapshot, addDoc, updateDoc, deleteDoc, orderBy, where, getDocs, signInWithEmailAndPassword, signOut, onAuthStateChanged };
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght=400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #F8FAFC; color: #0F172A; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 20px; }
    </style>
</head>
<body class="bg-slate-50 antialiased">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        const Icon = ({ name, size = 20, className = "" }) => {
            const iconRef = useRef(null);
            useEffect(() => {
                if (iconRef.current && window.lucide) {
                    iconRef.current.innerHTML = "";
                    const iconElement = document.createElement('i');
                    iconElement.setAttribute('data-lucide', name);
                    iconElement.style.width = `${size}px`;
                    iconElement.style.height = `${size}px`;
                    if (className) iconElement.className = className;
                    iconRef.current.appendChild(iconElement);
                    window.lucide.createIcons();
                }
            }, [name, size, className]);
            return <span ref={iconRef} className="inline-flex items-center justify-center"></span>;
        };const App = () => {
            const [isLoggedIn, setIsLoggedIn] = useState(false);
            const [currentUser, setCurrentUser] = useState('');
            const [loginForm, setLoginForm] = useState({ email: '', password: '' });
            const [systemUsers, setSystemUsers] = useState([]);

            const [regions, setRegions] = useState([]);
            const [doctors, setDoctors] = useState([]);
            const [doctorVisits, setDoctorVisits] = useState([]);
            const [systemLogs, setSystemLogs] = useState([]); 
            const [fbReady, setFbReady] = useState(false);

            const [activeRegion, setActiveRegion] = useState('all');
            const [searchTerm, setSearchTerm] = useState('');
            const [showModal, setShowModal] = useState(false);
            const [modalType, setModalType] = useState(''); 
            const [selectedDoctor, setSelectedDoctor] = useState(null);
            const [draggedRegionId, setDraggedRegionId] = useState(null);
            const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);

            const [doctorForm, setDoctorForm] = useState({ name: '', phone: '', clinic: '', regionId: '', note: '', visitToday: false });
            const [editingDoctorId, setEditingDoctorId] = useState(null);
            
            const [regionForm, setRegionForm] = useState({ name: '' });
            const [userForm, setUserForm] = useState({ email: '', password: '', name: '' });
            const [newNoteText, setNewNoteText] = useState('');
            
            const [editingNoteId, setEditingNoteId] = useState(null);
            const [reminderDate, setReminderDate] = useState(''); 
            const [reminderEmail, setReminderEmail] = useState('');
            const [visitStatus, setVisitStatus] = useState('success');
            const [bulkNavText, setBulkNavText] = useState('');
            const [parsedPreviewDoctors, setParsedPreviewDoctors] = useState([]);

            const fileInputRef = useRef(null);

            const getTenDaysLaterISO = () => {
                const now = new Date();
                const tenDaysLater = new Date(now.getTime() + 10 * 24 * 60 * 60 * 1000);
                const tzoffset = tenDaysLater.getTimezoneOffset() * 60000;
                return new Date(tenDaysLater.getTime() - tzoffset).toISOString().slice(0, 16);
            };

            // 🔐 GERÇEK FIREBASE AUTHENTICATION DİNLEYİCİSİ
            useEffect(() => {
                const checkInterval = setInterval(() => {
                    if (window.db && window.auth && window.FirebaseMethods) {
                        clearInterval(checkInterval);
                        const { collection, query, onSnapshot, orderBy, onAuthStateChanged } = window.FirebaseMethods;
                        
                        onAuthStateChanged(window.auth, (user) => {
                            if (user) {
                                setIsLoggedIn(true);
                                setCurrentUser(user.displayName || user.email);
                            } else {
                                setIsLoggedIn(false);
                                setCurrentUser('');
                            }
                        });

                        onSnapshot(query(collection(window.db, 'shared_regions'), orderBy('order', 'asc')), (s) => setRegions(s.docs.map(d => ({ ...d.data(), id: d.id }))));
                        onSnapshot(collection(window.db, 'shared_doctors'), (s) => setDoctors(s.docs.map(d => ({ ...d.data(), id: d.id }))));
                        onSnapshot(query(collection(window.db, 'shared_visits'), orderBy('timestamp', 'desc')), (s) => setDoctorVisits(s.docs.map(d => ({ ...d.data(), id: d.id }))));
                        onSnapshot(collection(window.db, 'shared_users'), (s) => setSystemUsers(s.docs.map(d => ({ ...d.data(), id: d.id }))));
                        onSnapshot(query(collection(window.db, 'shared_logs'), orderBy('timestamp', 'desc')), (s) => setSystemLogs(s.docs.map(d => ({ ...d.data(), id: d.id }))));
                        setFbReady(true);
                    }
                }, 100);
                return () => clearInterval(checkInterval);
            }, []);

            const logSystemAction = async (type, details, targetIds, backupData = null) => {
                const { collection, addDoc } = window.FirebaseMethods;
                await addDoc(collection(window.db, 'shared_logs'), {
                    user: currentUser, type: type, details: details, targetIds: targetIds, backupData: backupData, date: new Date().toLocaleString('tr-TR'), timestamp: Date.now()
                });
            };

            const handleUndoAction = async (log) => {
                if (!confirm(`"${log.details}" işlemini geri almak istiyor musunuz?`)) return;
                const { doc, deleteDoc, collection, addDoc, updateDoc } = window.FirebaseMethods;

                try {
                    if (log.type === 'add_doctor' || log.type === 'bulk_nav_confirm' || log.type === 'excel_import') {
                        for (const id of log.targetIds) { await deleteDoc(doc(window.db, 'shared_doctors', id)); }
                        alert("↩️ İşlem Geri Alındı: Eklenen hekimler silindi.");
                    } else if (log.type === 'delete_doctor') {
                        await addDoc(collection(window.db, 'shared_doctors'), log.backupData);
                        alert("↩️ İşlem Geri Alındı: Silinen hekim kurtarıldı.");
                    } else if (log.type === 'add_note') {
                        for (const id of log.targetIds) { await deleteDoc(doc(window.db, 'shared_visits', id)); }
                        alert("↩️ İşlem Geri Alındı: Ziyaret notu silindi.");
                    }
                    await deleteDoc(doc(window.db, 'shared_logs', log.id));
                } catch (err) { alert("Hata oluştu."); }
            };

            // 🔐 FIREBASE AUTH GİRİŞ MOTORU
            const handleLoginSubmit = async (e) => {
                e.preventDefault();
                const { signInWithEmailAndPassword } = window.FirebaseMethods;
                try {
                    await signInWithEmailAndPassword(window.auth, loginForm.email, loginForm.password);
                    setLoginForm({ email: '', password: '' });
                } catch (err) {
                    alert("❌ Giriş Başarısız: E-Posta veya Şifre hatalı!");
                }
            };

            const handleLogoutAction = async () => {
                const { signOut } = window.FirebaseMethods;
                await signOut(window.auth);
            };

            // ⚠️ MÜKERRER KAYIT ENGELLEYİCİ EXCEL IMPORT MOTORU
            const handleExcelImport = (e) => {
                const file = e.target.files[0]; if (!file) return;
                const reader = new FileReader();
                reader.onload = async (evt) => {
                    const data = XLSX.utils.sheet_to_json(XLSX.read(evt.target.result, { type: 'binary' }).Sheets[wb.SheetNames[0]]);
                    const { collection, addDoc } = window.FirebaseMethods;
                    let defaultRegionId = regions[0]?.id || 'reg-1';
                    let addedIds = [];

                    for (const row of data) {
                        if (row["Hekim Adı Soyadı"]) {
                            // ⚠️ Eşsizlik Kontrolü: İsim veya telefon eşleşirse ekleme yapma
                            const isDuplicate = doctors.some(d => cleanTurkish(d.name) === cleanTurkish(row["Hekim Adı Soyadı"]) || (row["Telefon"] && d.phone === row["Telefon"]));
                            if (!isDuplicate) {
                                const docRef = await addDoc(collection(window.db, 'shared_doctors'), {
                                    name: row["Hekim Adı Soyadı"], clinic: row["Klinik"] || '', phone: row["Telefon"] || '', regionId: defaultRegionId, visitToday: false, lastVisitStatus: 'none', lastVisitTime: 0, timestamp: Date.now()
                                });
                                addedIds.push(docRef.id);
                            }
                        }
                    }
                    await logSystemAction('excel_import', `Excel'den mükerrersiz ${addedIds.length} hekim içeri aktarıldı.`, addedIds);
                    alert(`✅ Yükleme bitti! ${addedIds.length} yeni hekim eklendi.`);
                };
                reader.readAsBinaryString(file);
            };

            // ⚠️ MÜKERRER KAYIT ENGELLEYİCİ TEKİL HEKİM EKLEME
            const handleAddDoctor = async (e) => {
                e.preventDefault(); if (!doctorForm.name || !doctorForm.regionId) return;
                const { collection, addDoc, doc, updateDoc } = window.FirebaseMethods;
                
                if (editingDoctorId) {
                    const oldDoc = doctors.find(d => d.id === editingDoctorId);
                    await updateDoc(doc(window.db, 'shared_doctors', editingDoctorId), { name: doctorForm.name, phone: doctorForm.phone, clinic: doctorForm.clinic, regionId: doctorForm.regionId });
                    await logSystemAction('edit_doctor', `"${doctorForm.name}" bilgileri güncellendi.`, [editingDoctorId], oldDoc);
                } else {
                    // ⚠️ Eşsizlik Kontrolü
                    const isDuplicate = doctors.some(d => cleanTurkish(d.name) === cleanTurkish(doctorForm.name));
                    if (isDuplicate) { alert("❌ Bu hekim sistemde zaten kayıtlı!"); return; }

                    const docRef = await addDoc(collection(window.db, 'shared_doctors'), {
                        name: doctorForm.name, phone: doctorForm.phone, clinic: doctorForm.clinic, regionId: doctorForm.regionId, visitToday: !!doctorForm.visitToday, lastVisitStatus: 'none', lastVisitTime: 0, timestamp: Date.now()
                    });
                    await logSystemAction('add_doctor', `"${doctorForm.name}" sisteme eklendi.`, [docRef.id]);
                }
                setShowModal(false); setEditingDoctorId(null); setDoctorForm({ name: '', phone: '', clinic: '', regionId: '', note: '', visitToday: false });
            };

            // ⚠️ ŞELALE TİPİ SİLME (CASCADING DELETE): Doktor silinince tüm notları temizlenir
            const handleDeleteDoctor = async (id) => {
                const targetDoc = doctors.find(d => d.id === id);
                if (confirm(`"${targetDoc?.name}" hekimini ve ona ait TÜM geçmiş ziyaret notlarını silmek istediğinize emin misiniz?`)) {
                    const { doc, deleteDoc } = window.FirebaseMethods;
                    
                    // Önce hekime bağlı tüm notları temizle (Veritabanı çöplüğü engellenir)
                    const relatedVisits = doctorVisits.filter(v => v.doctorId === id);
                    for (const v of relatedVisits) { await deleteDoc(doc(window.db, 'shared_visits', v.id)); }

                    await logSystemAction('delete_doctor', `"${targetDoc?.name}" ve tüm notları silindi.`, [id], targetDoc);
                    await deleteDoc(doc(window.db, 'shared_doctors', id));
                }
            };

            // Ziyaret Notu Ekleme ve Akıllı Renk Durum Güncellemesi
            const handleSaveNote = async (docId) => {
                if (!newNoteText.trim()) return;
                const { collection, addDoc, doc, updateDoc } = window.FirebaseMethods;
                
                const noteRef = await addDoc(collection(window.db, 'shared_visits'), {
                    doctorId: docId, text: newNoteText, rawText: newNoteText, date: new Date().toLocaleString('tr-TR'), timestamp: Date.now(), user: currentUser, status: visitStatus
                });

                await updateDoc(doc(window.db, 'shared_doctors', docId), { lastVisitStatus: visitStatus, lastVisitTime: Date.now() });
                const dName = doctors.find(d => d.id === docId)?.name || "Hekim";
                await logSystemAction('add_note', `"${dName}" için ziyaret notu düşüldü.`, [noteRef.id]);

                setNewNoteText(''); setVisitStatus('success');
            };

            // ⚠️ NOT SİLİNDİĞİNDE TRAFİK IŞIĞINI YENİDEN HESAPLAMA MOTORU
            const handleDeleteNote = async (noteId, docId) => {
                if (!confirm("Bu notu silmek istediğinize emin misiniz?")) return;
                const { doc, deleteDoc, updateDoc } = window.FirebaseMethods;
                
                await deleteDoc(doc(window.db, 'shared_visits', noteId));

                // Kalan son nota göre kartın rengini dinamik yeniden hesapla (Veri tutarlılığı)
                const remainingVisits = doctorVisits.filter(v => v.doctorId === docId && v.id !== noteId);
                if (remainingVisits.length > 0) {
                    await updateDoc(doc(window.db, 'shared_doctors', docId), { lastVisitStatus: remainingVisits[0].status, lastVisitTime: remainingVisits[0].timestamp });
                } else {
                    await updateDoc(doc(window.db, 'shared_doctors', docId), { lastVisitStatus: 'none', lastVisitTime: 0 });
                }
            };

            const handleParseToPreview = (e) => {
                e.preventDefault(); if (!bulkNavText.trim()) return;
                const lines = bulkNavText.split('\n'); let tempDocs = [];
                let currentName = ""; let currentPhone = ""; let currentClinic = "";

                for (let i = 0; i < lines.length; i++) {
                    const line = lines[i].trim(); if (!line) continue;
                    const phoneMatch = line.match(/(0\s?\d{3}\s?\d{3}\s?\d{2}\s?\d{2})/);
                    if (phoneMatch) { currentPhone = phoneMatch[0]; }
                    else if (line.toLowerCase().includes('diş') || line.toLowerCase().includes('poliklini') || line.toLowerCase().includes('muayene')) {
                        if (currentName) { tempDocs.push({ id: Date.now() + Math.random(), name: currentName, clinic: currentClinic || currentName, phone: currentPhone || '-' }); currentPhone = ""; currentClinic = ""; }
                        currentName = line;
                    } else if (line.length > 5 && line.length < 50 && !currentClinic) { currentClinic = line; }
                    if (i === lines.length - 1 && currentName) { tempDocs.push({ id: Date.now() + Math.random(), name: currentName, clinic: currentClinic || currentName, phone: currentPhone || '-' }); }
                }
                setParsedPreviewDoctors(tempDocs); setModalType('bulk_preview_modal');
            };

            const handleSavePreviewToFirebase = async () => {
                const { collection, addDoc } = window.FirebaseMethods;
                let defaultRegionId = regions[0]?.id || 'reg-1'; let addedIds = [];
                for (const d of parsedPreviewDoctors) {
                    const isDuplicate = doctors.some(x => cleanTurkish(x.name) === cleanTurkish(d.name));
                    if (!isDuplicate) {
                        const docRef = await addDoc(collection(window.db, 'shared_doctors'), { name: d.name, clinic: d.clinic, phone: d.phone, regionId: defaultRegionId, visitToday: false, lastVisitStatus: 'none', lastVisitTime: 0, timestamp: Date.now() });
                        addedIds.push(docRef.id);
                    }
                }
                await logSystemAction('bulk_nav_confirm', `Haritadan ${addedIds.length} hekim onaylanarak aktarıldı.`, addedIds);
                setParsedPreviewDoctors([]); setBulkNavText(''); setShowModal(false);
            };

            const cleanTurkish = (str) => String(str).toLocaleLowerCase('tr-TR').replace(/ğ/g, 'g').replace(/ü/g, 'u').replace(/ş/g, 's').replace(/ı/g, 'i').replace(/ö/g, 'o').replace(/ç/g, 'c');

            const filteredDoctors = useMemo(() => {
                const todayStr = new Date().toLocaleDateString('tr-TR');
                const fourteenDaysAgo = Date.now() - 14 * 24 * 60 * 60 * 1000;
                return doctors.filter(doc => {
                    if (activeRegion === 'failed_visits_panel') return doc.lastVisitStatus === 'fail' && doc.lastVisitTime >= fourteenDaysAgo;
                    if (activeRegion === 'success_visits_panel') return doc.lastVisitStatus === 'success' && doc.lastVisitTime >= fourteenDaysAgo;
                    if (activeRegion === 'report_panel') return doctorVisits.some(v => v.doctorId === doc.id && v.date && v.date.split(' ')[0] === todayStr);
                    if (activeRegion === 'today_panel') {
                        const hasTodayReminder = doctorVisits.filter(v => v.doctorId === doc.id).some(v => v.emailDate && v.emailDate.split(' ')[0] === todayStr);
                        return doc.visitToday || hasTodayReminder;
                    }
                    const matchesRegion = activeRegion === 'all' || doc.regionId === activeRegion;
                    return matchesRegion && (cleanTurkish(doc.name) + " " + cleanTurkish(doc.clinic || '')).includes(cleanTurkish(searchTerm));
                });
            }, [doctors, activeRegion, searchTerm, doctorVisits]);

            const handleTabSelect = (tabId) => { setActiveRegion(tabId); setIsMobileMenuOpen(false); };
            const handleExcelExport = () => { /* Mevcut Excel export mantığı */ };

            if (!fbReady) return <div className="min-h-screen flex items-center justify-center bg-slate-900 text-blue-500 font-black animate-pulse">GÜVENLİK DUVARI AŞILIYOR VE BAĞLANILIYOR...</div>;

            if (!isLoggedIn) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-slate-900 p-4">
                        <div className="w-full max-w-md bg-white rounded-[2.5rem] shadow-2xl p-10 animate-in">
                            <form onSubmit={handleLoginSubmit} className="space-y-4">
                                <h1 className="text-2xl font-black text-center text-slate-800">Seviye Dental <span className="text-blue-600">CRM</span></h1>
                                <p className="text-center text-xs font-bold text-slate-400 uppercase tracking-widest">Resmi Firebase Auth Girişi</p>
                                <input type="email" required className="w-full p-4 bg-slate-50 border rounded-2xl font-bold text-slate-700 focus:border-blue-600 outline-none" placeholder="E-Posta Adresiniz" value={loginForm.email} onChange={e => setLoginForm({...loginForm, email: e.target.value})} />
                                <input type="password" required className="w-full p-4 bg-slate-50 border rounded-2xl font-bold text-slate-700 focus:border-blue-600 outline-none" placeholder="Şifreniz" value={loginForm.password} onChange={e => setLoginForm({...loginForm, password: e.target.value})} />
                                <button type="submit" className="w-full py-4 bg-blue-600 text-white font-black rounded-2xl uppercase tracking-wider shadow-md">Güvenli Giriş Yap</button>
                            </form>
                        </div>
                    </div>
                );
            }

            return (
                <div className="flex flex-col lg:flex-row min-h-screen relative">
                    {isMobileMenuOpen && <div onClick={() => setIsMobileMenuOpen(false)} className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-40 lg:hidden"></div>}

                    <aside className="sidebar w-72 bg-slate-900 text-slate-400 p-6 flex flex-col h-screen fixed top-0 left-0 z-50 shadow-2xl transition-transform duration-300 lg:translate-x-0">
                        <div className="flex items-center justify-between mb-6 px-2">
                            <h1 className="text-xl font-extrabold text-white">Seviye<span className="text-blue-500">CRM</span></h1>
                            <button onClick={() => setIsMobileMenuOpen(false)} className="lg:hidden p-2 text-slate-400 border border-slate-700 rounded-xl"><Icon name="x" size={16} /></button>
                        </div>

                        <div className="space-y-1 overflow-y-auto flex-1 pr-1 custom-scrollbar">
                            <button onClick={() => handleTabSelect('today_panel')} className={`w-full flex items-center justify-between px-4 py-3 rounded-xl font-bold text-sm ${activeRegion === 'today_panel' ? 'bg-amber-500 text-white' : 'bg-slate-800/40 text-amber-400'}`}><span className="flex items-center gap-3"><Icon name="calendar-check" size={18} /> Bugün Gezilecekler</span></button>
                            <button onClick={() => handleTabSelect('report_panel')} className={`w-full flex items-center justify-between px-4 py-3 rounded-xl font-bold text-sm ${activeRegion === 'report_panel' ? 'bg-emerald-600 text-white' : 'bg-slate-800/40 text-emerald-400'}`}><span className="flex items-center gap-3"><Icon name="file-text" size={18} /> Akşam Saha Raporu</span></button>

                            <div className="pt-2 pb-1 px-2"><h2 className="text-[10px] font-black uppercase text-slate-500 tracking-wider">2 Haftalık Durum Takibi</h2></div>
                            <button onClick={() => handleTabSelect('failed_visits_panel')} className={`w-full flex items-center justify-between px-4 py-2.5 rounded-xl font-bold text-xs ${activeRegion === 'failed_visits_panel' ? 'bg-red-600 text-white' : 'bg-slate-800/40 text-red-400'}`}><span className="flex items-center gap-3"><Icon name="phone-off" size={14} /> 🔴 Tekrar Uğranacaklar</span></button>
                            <button onClick={() => handleTabSelect('success_visits_panel')} className={`w-full flex items-center justify-between px-4 py-2.5 rounded-xl font-bold text-xs mb-4 ${activeRegion === 'success_visits_panel' ? 'bg-indigo-600 text-white' : 'bg-slate-800/40 text-indigo-400'}`}><span className="flex items-center gap-3"><Icon name="check-circle" size={14} /> 🟢 Nadasa Bırakılanlar</span></button>

                            {currentUser.includes('admin') || currentUser.includes('Yönetici') ? (
                                <button onClick={() => handleTabSelect('logs_panel')} className={`w-full flex items-center gap-3 px-4 py-3 bg-red-950/20 text-red-400 border border-red-900/30 rounded-xl font-bold text-sm mb-4 ${activeRegion === 'logs_panel' ? 'bg-red-900 text-white shadow-lg' : ''}`}>
                                    <Icon name="shield-alert" size={18} /> 🛡️ Güvenlik & Sistem Logları
                                </button>
                            ) : null}

                            <div className="flex items-center justify-between mb-2 px-2 border-t border-slate-800 pt-3"><h2 className="text-xs font-black uppercase text-slate-400 tracking-wider">Bölgeler / Rotalar</h2><button onClick={() => { setModalType('region'); setEditingDoctorId(null); setShowModal(true); }} className="p-1 text-blue-400"><Icon name="plus" size={18} /></button></div>
                            
                            <button onClick={() => handleTabSelect('all')} className={`w-full flex items-center justify-between px-4 py-3 rounded-xl font-bold text-sm ${activeRegion === 'all' ? 'bg-blue-600 text-white' : 'text-slate-400'}`}>
                                <span className="flex items-center gap-3"><Icon name="globe" size={18} /> Tüm Hekimler</span>
                                <span className="text-xs bg-slate-800 text-slate-300 px-2 py-0.5 rounded-md font-black">{doctors.length}</span>
                            </button>
                            
                            {regions.map(reg => (
                                <div key={reg.id} onClick={() => handleTabSelect(reg.id)} className={`w-full flex items-center justify-between px-4 py-3 rounded-xl font-bold text-sm transition-all cursor-pointer ${activeRegion === reg.id ? 'bg-blue-600 text-white' : 'text-slate-400 hover:bg-slate-800'}`}>
                                    <span className="flex items-center gap-3 truncate"><Icon name="map-pin" size={16} /><span className="truncate">{reg.name}</span></span>
                                    <span className="text-xs bg-slate-800 text-slate-300 px-2 py-0.5 rounded-md font-black">{doctors.filter(d => d.regionId === reg.id).length}</span>
                                </div>
                            ))}

                            <div className="mt-4 pt-4 border-t border-slate-800 space-y-1">
                                <button onClick={() => { setModalType('bulk_nav'); setShowModal(true); }} className="w-full flex items-center gap-3 px-4 py-2.5 bg-blue-950/40 text-blue-400 font-bold text-xs rounded-xl"><Icon name="map" size={16} /> Haritadan Toplu Aktar</button>
                                <button onClick={handleExcelExport} className="w-full flex items-center gap-3 px-4 py-2.5 rounded-xl font-bold text-xs text-emerald-400"><Icon name="file-spreadsheet" size={16} /> Excel Portföy İndir</button>
                                <button onClick={() => fileInputRef.current.click()} className="w-full flex items-center gap-3 px-4 py-2.5 rounded-xl font-bold text-xs text-blue-400"><Icon name="upload" size={16} /> Excel'den Toplu Yükle</button>
                                <input type="file" ref={fileInputRef} onChange={handleExcelImport} accept=".xlsx, .xls" className="hidden" />
                            </div>
                        </div>

                        <div className="mt-auto pt-4 flex items-center justify-between bg-slate-800/40 p-3 rounded-2xl">
                            <div className="truncate"><p className="text-xs font-black text-white truncate">{currentUser}</p><p className="text-[8px] text-emerald-400 font-bold uppercase tracking-wider">Oturum Açık</p></div>
                            <button onClick={handleLogoutAction} className="p-2 text-red-400 hover:bg-red-400/10 rounded-xl"><Icon name="log-out" size={18} /></button>
                        </div>
                    </aside>

                    <main className="main-content flex-1 lg:ml-72 p-4 lg:p-10 bg-slate-50 min-h-screen pb-24">
                        {activeRegion === 'logs_panel' ? (
                            <div className="space-y-6 animate-in">
                                <header className="mb-6">
                                    <h2 className="text-2xl font-extrabold text-slate-800">🛡️ Sistem Güvenlik & İşlem Logları</h2>
                                    <p className="text-xs font-bold text-red-500 uppercase tracking-widest mt-1">Sarsılmaz veri bütünlüğü ve tek tıkla geri alma (Undo) motoru</p>
                                </header>
                                <div className="bg-white rounded-[2rem] border p-6 shadow-sm">
                                    <div className="space-y-4">
                                        {systemLogs.map(log => (
                                            <div key={log.id} className="flex flex-col sm:flex-row justify-between items-start sm:items-center bg-slate-50 p-4 rounded-2xl border gap-4 transition-all">
                                                <div>
                                                    <div className="flex items-center gap-2 mb-1">
                                                        <span className="text-[10px] font-black uppercase bg-slate-900 text-white px-2 py-0.5 rounded">{log.user}</span>
                                                        <span className="text-[9px] font-bold text-slate-400">⏱ {log.date}</span>
                                                    </div>
                                                    <p className="text-xs font-extrabold text-slate-700">"{log.details}"</p>
                                                </div>
                                                <button onClick={() => handleUndoAction(log)} className="py-2 px-4 bg-white text-red-600 font-black rounded-xl border border-red-200 text-xs shadow-sm uppercase tracking-wider flex items-center gap-1">
                                                    <Icon name="rotate-ccw" size={14} /> Geri Al (Undo)
                                                </button>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        ) : activeRegion === 'report_panel' ? (
                            <div className="space-y-6 animate-in">
                                <header className="mb-6"><h2 className="text-2xl font-extrabold text-slate-800">📋 Bugünün Saha Ziyaret Raporu</h2></header>
                                <div className="bg-white rounded-[2rem] border p-6 shadow-sm overflow-hidden">
                                    <table className="w-full text-left border-collapse">
                                        <thead><tr className="border-b text-[10px] font-black uppercase text-slate-400"><th className="py-4 px-4">Hekim Adı</th><th className="py-4 px-4">Klinik</th><th className="py-4 px-4">Bölge</th><th className="py-4 px-4">Ziyaret Notu</th></tr></thead>
                                        <tbody className="divide-y text-xs font-bold text-slate-700">
                                            {filteredDoctors.map(doc => {
                                                const todayStr = new Date().toLocaleDateString('tr-TR');
                                                const todayVisits = doctorVisits.filter(v => v.doctorId === doc.id && v.date && v.date.split(' ')[0] === todayStr);
                                                return todayVisits.map((v, index) => (
                                                    <tr key={v.id} className="hover:bg-slate-50">
                                                        {index === 0 ? (
                                                            <><td className="py-4 px-4 font-extrabold text-slate-900" rowSpan={todayVisits.length}>{doc.name}</td><td className="py-4 px-4 text-slate-500" rowSpan={todayVisits.length}>{doc.clinic || '-'}</td><td className="py-4 px-4" rowSpan={todayVisits.length}><span className="bg-slate-100 text-slate-600 px-2 py-0.5 rounded">{regions.find(r => r.id === doc.regionId)?.name}</span></td></>
                                                        ) : null}
                                                        <td className="py-4 px-4 border-l bg-emerald-50/30"><p>"{v.rawText || v.text}"</p><div className="flex gap-2 mt-1 text-[9px] font-black"><span className="text-slate-400">⏱ {v.date.split(' ')[1]}</span><span className="text-blue-600">👤 {v.user}</span></div></td>
                                                    </tr>
                                                ));
                                            })}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        ) : (
                            <>
                                <div className="flex justify-between items-center mb-6">
                                    <h2 className="text-2xl font-extrabold text-slate-800">Saha Portföy Listesi</h2>
                                    <button onClick={() => { setModalType('doctor'); setEditingDoctorId(null); setDoctorForm({ name: '', phone: '', clinic: '', regionId: '', note: '', visitToday: false }); setShowModal(true); }} className="px-4 py-2.5 bg-blue-600 text-white font-bold text-xs uppercase rounded-xl">+ Ekle</button>
                                </div>
                                <div className="mb-6 relative">
                                    <input type="text" placeholder="Hekim adı veya klinik aratın..." className="w-full pl-12 pr-4 py-4 bg-white border rounded-2xl outline-none shadow-sm" value={searchTerm} onChange={e => setSearchTerm(e.target.value)}/>
                                    <div className="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"><Icon name="search" size={20} /></div>
                                </div>
                                <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6">
                                    {filteredDoctors.map(doc => {
                                        const lastVisit = doctorVisits.find(v => v.doctorId === doc.id);
                                        return (
                                            <div key={doc.id} className={`bg-white rounded-3xl border-l-8 p-6 flex flex-col justify-between shadow-sm border-y border-r border-slate-100 ${doc.lastVisitStatus === 'success' ? 'border-l-green-500' : doc.lastVisitStatus === 'fail' ? 'border-l-red-500' : 'border-l-slate-300'}`}>
                                                <div>
                                                    <div className="flex justify-between items-start mb-4">
                                                        <div className="bg-blue-50 text-blue-600 p-3 rounded-2xl"><Icon name="user-round" size={24} /></div>
                                                        <button onClick={(e) => { e.stopPropagation(); toggleTodayVisit(doc); }} className="text-[10px] font-black uppercase bg-slate-100 text-slate-600 px-2.5 py-1 rounded-md">{doc.visitToday ? '🌟 Listemde' : '➕ Ekle'}</button>
                                                    </div>
                                                    <h3 className="text-lg font-extrabold text-slate-800 mb-1">{doc.name}</h3>
                                                    {doc.clinic && <p className="text-xs text-slate-400 font-bold mb-1">🏢 {doc.clinic}</p>}
                                                    {doc.phone && <p className="text-xs text-slate-400 font-bold mb-2">📞 {doc.phone}</p>}
                                                    <div className="bg-slate-50 rounded-xl p-3 border mt-3 text-xs">
                                                        {lastVisit ? <p className="font-bold text-slate-700">"{lastVisit.rawText || lastVisit.text}"</p> : <p className="text-slate-400 italic">Not alınmamış.</p>}
                                                    </div>
                                                </div>
                                                <div className="flex gap-2 mt-4">
                                                    <button onClick={() => { setSelectedDoctor(doc); setEditingNoteId(null); setNewNoteText(''); setVisitStatus(doc.lastVisitStatus || 'success'); }} className="flex-1 py-2.5 bg-slate-900 text-white font-bold text-xs rounded-xl">Detay & Notlar</button>
                                                    <button onClick={() => handleStartEditDoctor(doc)} className="p-2.5 bg-blue-50 text-blue-600 rounded-xl"><Icon name="pencil" size={16}/></button>
                                                    <button onClick={() => handleDeleteDoctor(doc.id)} className="p-2.5 bg-red-50 text-red-500 rounded-xl"><Icon name="trash-2" size={16}/></button>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </>
                        )}
                    </main>

                    {/* MODAL VE GÜVENLİK ÖNİZLEME PENCERELERİ */}
                    {selectedDoctor && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-md z-[150] flex items-center justify-center p-4">
                            <div className="bg-white rounded-[2.5rem] shadow-2xl w-full max-w-xl p-6 sm:p-8 overflow-hidden animate-in">
                                <div className="flex justify-between items-center mb-4">
                                    <h3 className="text-xl font-extrabold text-slate-900">{selectedDoctor.name} Günlüğü</h3>
                                    <button onClick={() => { setSelectedDoctor(null); setEditingNoteId(null); setNewNoteText(''); }} className="p-2 border rounded-xl"><Icon name="x" size={18} /></button>
                                </div>
                                <div className="space-y-4 max-h-[70vh] overflow-y-auto pr-1 custom-scrollbar">
                                    <div className="space-y-3 bg-slate-50 p-4 rounded-2xl border">
                                        <textarea placeholder="Ziyaret notunu girin..." className="w-full p-3 border rounded-xl text-xs font-bold h-16 bg-white" value={newNoteText} onChange={e => setNewNoteText(e.target.value)} />
                                        <div className="grid grid-cols-2 gap-2">
                                            <button type="button" onClick={() => setVisitStatus('success')} className={`py-2 px-3 rounded-xl text-xs font-black bg-white uppercase tracking-wider border ${visitStatus === 'success' ? 'bg-green-600 text-white' : ''}`}>Görüşme Sağlandı</button>
                                            <button type="button" onClick={() => setVisitStatus('fail')} className={`py-2 px-3 rounded-xl text-xs font-black bg-white uppercase tracking-wider border ${visitStatus === 'fail' ? 'bg-red-600 text-white' : ''}`}>Görüşme Sağlanamadı</button>
                                        </div>
                                        <button type="button" onClick={async () => { await handleSaveNote(selectedDoctor.id); }} className="w-full py-2.5 bg-blue-600 text-white font-black text-xs uppercase rounded-xl">Kaydet</button>
                                    </div>
                                    <div className="space-y-2 pt-4 border-t">
                                        {doctorVisits.filter(v => v.doctorId === selectedDoctor.id).map(n => (
                                            <div key={n.id} className="bg-slate-50 p-4 rounded-2xl border relative">
                                                {/* ⚠️ NOT SİLME VE ANLIK RENK GÜNCELLEME BUTONU */}
                                                <button onClick={() => handleDeleteNote(n.id, selectedDoctor.id)} className="absolute right-3 top-3 text-slate-300 hover:text-red-500"><Icon name="trash-2" size={14}/></button>
                                                <span className="text-[9px] font-black text-blue-500 block">{n.date}</span>
                                                <p className="text-xs font-bold text-slate-700 mt-1.5 pr-8">"{n.rawText || n.text}"</p>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {showModal && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-md z-[150] flex items-center justify-center p-4">
                            <div className="bg-white rounded-[2.5rem] shadow-2xl w-full max-w-md p-8 animate-in">
                                <div className="flex justify-between items-center mb-6">
                                    <h3 className="text-lg font-extrabold text-slate-900 uppercase">{modalType === 'doctor' ? 'Hekim Kartı' : modalType === 'region' ? 'Yeni Rota' : 'Haritadan Aktar'}</h3>
                                    <button onClick={() => { setShowModal(false); setEditingDoctorId(null); }} className="p-2 border rounded-xl"><Icon name="x" size={16} /></button>
                                </div>
                                {modalType === 'bulk_nav' && (
                                    <form onSubmit={handleParseToPreview} className="space-y-4">
                                        <textarea required placeholder="Harita verilerini buraya yapıştırın..." className="w-full p-4 border rounded-2xl font-bold text-xs h-48 bg-slate-50" value={bulkNavText} onChange={e => setBulkNavText(e.target.value)} />
                                        <button type="submit" className="w-full py-4 bg-blue-600 text-white font-black text-xs uppercase rounded-xl">Önizleme Listesi Oluştur</button>
                                    </form>
                                )}
                                {modalType === 'doctor' && (
                                    <form onSubmit={handleAddDoctor} className="space-y-4">
                                        <input type="text" required placeholder="Hekim Adı Soyadı" className="w-full p-4 border rounded-xl font-bold text-sm" value={doctorForm.name} onChange={e => setDoctorForm({...doctorForm, name: e.target.value})} />
                                        <input type="text" placeholder="Klinik / Hastane" className="w-full p-4 border rounded-xl font-bold text-sm" value={doctorForm.clinic} onChange={e => setDoctorForm({...doctorForm, clinic: e.target.value})} />
                                        <input type="text" placeholder="Telefon Numarası" className="w-full p-4 border rounded-xl font-bold text-sm" value={doctorForm.phone} onChange={e => setDoctorForm({...doctorForm, phone: e.target.value})} />
                                        <select required className="w-full p-4 border rounded-xl font-bold text-sm bg-slate-50" value={doctorForm.regionId} onChange={e => setDoctorForm({...doctorForm, regionId: e.target.value})}><option value="">Bölge / Rota Seçin...</option>{regions.map(r => <option key={r.id} value={r.id}>{r.name}</option>)}</select>
                                        <button type="submit" className="w-full py-4 bg-blue-600 text-white font-black text-xs uppercase rounded-xl">{editingDoctorId ? 'Kaydet' : 'Ekle'}</button>
                                    </form>
                                )}
                            </div>
                        </div>
                    )}

                    {/* ⚠️ GÜVENLİK ÖNİZLEME MODALI */}
                    {modalType === 'bulk_preview_modal' && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-md z-[200] flex items-center justify-center p-4">
                            <div className="bg-white rounded-[2.5rem] shadow-2xl w-full max-w-4xl p-8 overflow-hidden max-h-[85vh] flex flex-col justify-between animate-in">
                                <div>
                                    <h3 className="text-xl font-black text-slate-800 mb-2">📋 Güvenlik ve Eşsizlik Önizleme Paneli</h3>
                                    <div className="overflow-y-auto max-h-[50vh] pr-2 custom-scrollbar space-y-2">
                                        {parsedPreviewDoctors.map(p => (
                                            <div key={p.id} className="flex justify-between items-center p-3 bg-slate-50 rounded-xl border text-xs font-bold text-slate-700">
                                                <div className="grid grid-cols-3 flex-1 gap-2">
                                                    <div>{p.name}</div><div>{p.clinic}</div><div>{p.phone}</div>
                                                </div>
                                                <button onClick={() => setParsedPreviewDoctors(parsedPreviewDoctors.filter(x => x.id !== p.id))} className="text-red-500 p-2"><Icon name="trash-2" size={16} /></button>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                                <div className="flex gap-3 pt-6 border-t mt-4">
                                    <button onClick={() => setModalType('bulk_nav')} className="py-3 px-6 bg-slate-100 text-slate-600 font-bold rounded-xl text-xs uppercase">Geri</button>
                                    <button onClick={handleSavePreviewToFirebase} className="flex-1 py-3 bg-blue-600 text-white font-black text-xs uppercase rounded-xl shadow-md">Temizlenen {parsedPreviewDoctors.length} Hekimi Aktar</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
