<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seviye Dental - Ortak Saha Satış & CRM Sistemi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, doc, collection, query, onSnapshot, addDoc, updateDoc, deleteDoc, orderBy } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        
        const firebaseConfig = {
            apiKey: "AIzaSyCJJP857pMmLoCc7CMzswHNwTp_TAybMdE",
            authDomain: "webapp-d239c.firebaseapp.com",
            projectId: "webapp-d239c",
            storageBucket: "webapp-d239c.firebasestorage.app",
            messagingSenderId: "965046349663",
            appId: "1:965046349663:web:dbdda634472521accad0ea"
        };

        const app = initializeApp(firebaseConfig);
        window.db = getFirestore(app);
        window.FirebaseMethods = { doc, collection, query, onSnapshot, addDoc, updateDoc, deleteDoc, orderBy };
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #F8FAFC; color: #0F172A; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 20px; }
    </style>
</head>
<body class="bg-slate-50 antialiased">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        const Icon = ({ name, size = 20, className = "" }) => {
            const iconRef = useRef(null);
            useEffect(() => {
                if (iconRef.current && window.lucide) {
                    iconRef.current.innerHTML = "";
                    const iconElement = document.createElement('i');
                    iconElement.setAttribute('data-lucide', name);
                    iconElement.style.width = `${size}px`;
                    iconElement.style.height = `${size}px`;
                    if (className) iconElement.className = className;
                    iconRef.current.appendChild(iconElement);
                    window.lucide.createIcons();
                }
            }, [name, size, className]);
            return <span ref={iconRef} className="inline-flex items-center justify-center"></span>;
        };const App = () => {
            const [isLoggedIn, setIsLoggedIn] = useState(() => !!localStorage.getItem('crm_user_session'));
            const [currentUser, setCurrentUser] = useState(() => localStorage.getItem('crm_user_session') || '');
            const [loginForm, setLoginForm] = useState({ username: '', password: '' });
            const [systemUsers, setSystemUsers] = useState([]);

            const [regions, setRegions] = useState([]);
            const [doctors, setDoctors] = useState([]);
            const [doctorVisits, setDoctorVisits] = useState([]);
            const [systemLogs, setSystemLogs] = useState([]); // ⏳ Yeni Log Durumu
            const [fbReady, setFbReady] = useState(false);

            const [activeRegion, setActiveRegion] = useState('all');
            const [searchTerm, setSearchTerm] = useState('');
            const [showModal, setShowModal] = useState(false);
            const [modalType, setModalType] = useState(''); 
            const [selectedDoctor, setSelectedDoctor] = useState(null);
            const [draggedRegionId, setDraggedRegionId] = useState(null);
            const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);

            const [doctorForm, setDoctorForm] = useState({ name: '', phone: '', clinic: '', regionId: '', note: '', visitToday: false });
            const [editingDoctorId, setEditingDoctorId] = useState(null);
            
            const [regionForm, setRegionForm] = useState({ name: '' });
            const [userForm, setUserForm] = useState({ username: '', password: '', name: '' });
            const [newNoteText, setNewNoteText] = useState('');
            
            const [editingNoteId, setEditingNoteId] = useState(null);
            const [reminderDate, setReminderDate] = useState(''); 
            const [reminderEmail, setReminderEmail] = useState('');
            const [visitStatus, setVisitStatus] = useState('success');
            const [bulkNavText, setBulkNavText] = useState('');

            const fileInputRef = useRef(null);

            const getTenDaysLaterISO = () => {
                const now = new Date();
                const tenDaysLater = new Date(now.getTime() + 10 * 24 * 60 * 60 * 1000);
                const tzoffset = tenDaysLater.getTimezoneOffset() * 60000;
                return new Date(tenDaysLater.getTime() - tzoffset).toISOString().slice(0, 16);
            };

            useEffect(() => {
                if (!isLoggedIn) return;
                let timeoutId; const idleTime = 2 * 60 * 1000;
                const resetTimer = () => { clearTimeout(timeoutId); timeoutId = setTimeout(handleLogout, idleTime); };
                const handleLogout = () => {
                    setIsLoggedIn(false); setCurrentUser(''); localStorage.removeItem('crm_user_session');
                    alert("🚨 Hareketsizlik nedeniyle oturumunuz kapatılmıştır.");
                };
                const events = ['mousemove', 'mousedown', 'click', 'scroll', 'keypress', 'touchstart'];
                events.forEach(event => window.addEventListener(event, resetTimer));
                resetTimer();
                return () => { clearTimeout(timeoutId); events.forEach(event => window.removeEventListener(event, resetTimer)); };
            }, [isLoggedIn]);

            useEffect(() => {
                const checkInterval = setInterval(() => {
                    if (window.db && window.FirebaseMethods) {
                        clearInterval(checkInterval);
                        const { collection, query, onSnapshot, orderBy } = window.FirebaseMethods;
                        onSnapshot(query(collection(window.db, 'shared_regions'), orderBy('order', 'asc')), (s) => setRegions(s.docs.map(d => ({ ...d.data(), id: d.id }))));
                        onSnapshot(collection(window.db, 'shared_doctors'), (s) => setDoctors(s.docs.map(d => ({ ...d.data(), id: d.id }))));
                        onSnapshot(query(collection(window.db, 'shared_visits'), orderBy('timestamp', 'desc')), (s) => setDoctorVisits(s.docs.map(d => ({ ...d.data(), id: d.id }))));
                        onSnapshot(collection(window.db, 'shared_users'), (s) => setSystemUsers(s.docs.map(d => ({ ...d.data(), id: d.id }))));
                        
                        // 🛰️ Canlı Log Dinleyicisi
                        onSnapshot(query(collection(window.db, 'shared_logs'), orderBy('timestamp', 'desc')), (s) => {
                            setSystemLogs(s.docs.map(d => ({ ...d.data(), id: d.id })));
                        });

                        setFbReady(true);
                    }
                }, 100);
                return () => clearInterval(checkInterval);
            }, []);

            useEffect(() => { if (selectedDoctor && !editingNoteId) setReminderDate(getTenDaysLaterISO()); }, [selectedDoctor, editingNoteId]);

            // ✍️ Sistem Log Yazma Yardımcı Fonksiyonu
            const createLog = async (type, details, targetIds) => {
                const { collection, addDoc } = window.FirebaseMethods;
                await addDoc(collection(window.db, 'shared_logs'), {
                    user: currentUser,
                    type: type, // 'add_doctor', 'bulk_nav', 'delete_doctor', 'add_note'
                    details: details,
                    targetIds: targetIds, // Etkilenen döküman ID'lerinin listesi
                    date: new Date().toLocaleString('tr-TR'),
                    timestamp: Date.now()
                });
            };

            // ↩️ TÜM İŞLEMLERİ GERİ ALMA SİHRİ (UNDO MOTORU)
            const handleUndoAction = async (log) => {
                if (!confirm(`"${log.details}" işlemini geri almak istediğinize emin misiniz?`)) return;
                const { doc, deleteDoc, collection, addDoc } = window.FirebaseMethods;

                try {
                    if (log.type === 'add_doctor' || log.type === 'bulk_nav' || log.type === 'excel_import') {
                        // Toplu veya tekil eklenen hekimleri buluttan geri siler
                        for (const id of log.targetIds) {
                            await deleteDoc(doc(window.db, 'shared_doctors', id));
                        }
                        alert("↩️ Eklenen hekimler veri tabanından başarıyla silindi ve geri alındı!");
                    } else if (log.type === 'delete_doctor') {
                        // Silinen hekimi tüm verileriyle mezardan çıkarır geri ekler
                        const restoreData = log.backupData;
                        await addDoc(collection(window.db, 'shared_doctors'), restoreData);
                        alert("↩️ Silinen hekim tüm bilgileriyle başarıyla geri getirildi!");
                    } else if (log.type === 'add_note') {
                        // Eklenen ziyareti geri siler
                        for (const id of log.targetIds) {
                            await deleteDoc(doc(window.db, 'shared_visits', id));
                        }
                        alert("↩️ Eklenen ziyaret notu başarıyla geri alındı!");
                    }
                    // Tetiklenen logu sistemden temizle
                    await deleteDoc(doc(window.db, 'shared_logs', log.id));
                } catch (err) {
                    alert("Geri alma esnasında bir hata oluştu.");
                }
            };

            const handleBulkNavParse = async (e) => {
                e.preventDefault(); if (!bulkNavText.trim()) return;
                const lines = bulkNavText.split('\n');
                const { collection, addDoc } = window.FirebaseMethods;
                let defaultRegionId = regions[0]?.id || 'reg-1';
                let addedIds = [];

                let currentName = ""; let currentPhone = ""; let currentClinic = "";

                const pushDoc = async (n, c, p) => {
                    const docRef = await addDoc(collection(window.db, 'shared_doctors'), {
                        name: n, clinic: c || n, phone: p || '-', regionId: defaultRegionId, visitToday: false, lastVisitStatus: 'none', lastVisitTime: 0, timestamp: Date.now()
                    });
                    addedIds.push(docRef.id);
                };

                for (let i = 0; i < lines.length; i++) {
                    const line = lines[i].trim(); if (!line) continue;
                    const phoneMatch = line.match(/(0\s?\d{3}\s?\d{3}\s?\d{2}\s?\d{2})|(\+90\d{10})|(\d{7,11})/);

                    if (phoneMatch) { currentPhone = phoneMatch[0]; }
                    else if (line.toLowerCase().includes('diş') || line.toLowerCase().includes('poliklini') || line.toLowerCase().includes('muayene') || line.toLowerCase().includes('dt.')) {
                        if (currentName) { await pushDoc(currentName, currentClinic, currentPhone); currentPhone = ""; currentClinic = ""; }
                        currentName = line;
                    } else if (line.length > 5 && line.length < 50 && !currentClinic) { currentClinic = line; }

                    if (i === lines.length - 1 && currentName) { await pushDoc(currentName, currentClinic, currentPhone); }
                }

                // 📝 Haritadan aktarım log kaydı oluşturuluyor
                await createLog('bulk_nav', `Haritadan toplu ${addedIds.length} adet potansiyel hekim aktarıldı.`, addedIds);

                alert(`🎯 Harita verisinden ${addedIds.length} adet klinik başarıyla eklendi!`);
                setBulkNavText(''); setShowModal(false);
            };

            const handleExcelImport = (e) => {
                const file = e.target.files[0]; if (!file) return;
                const reader = new FileReader();
                reader.onload = async (evt) => {
                    const data = XLSX.utils.sheet_to_json(XLSX.read(evt.target.result, { type: 'binary' }).Sheets[wb.SheetNames[0]]);
                    const { collection, addDoc } = window.FirebaseMethods;
                    let defaultRegionId = regions[0]?.id || 'reg-1';
                    let addedIds = [];
                    for (const row of data) {
                        if (row["Hekim Adı Soyadı"]) {
                            const docRef = await addDoc(collection(window.db, 'shared_doctors'), {
                                name: row["Hekim Adı Soyadı"], clinic: row["Klinik"] || '', phone: row["Telefon"] || '', regionId: defaultRegionId, visitToday: false, lastVisitStatus: 'none', lastVisitTime: 0, timestamp: Date.now()
                            });
                            addedIds.push(docRef.id);
                        }
                    }
                    await createLog('excel_import', `Excel dosyasından toplu ${addedIds.length} hekim içeri aktarıldı.`, addedIds);
                    alert(`✅ ${data.length} adet hekim yüklendi!`);
                };
                reader.readAsBinaryString(file);
            };

            const handleExcelExport = () => {
                const exportData = doctors.map(d => ({ "Hekim Adı Soyadı": d.name, "Klinik": d.clinic || '', "Telefon": d.phone || '', "Bölge": regions.find(r => r.id === d.regionId)?.name || 'Bilinmeyen' }));
                const ws = XLSX.utils.json_to_sheet(exportData); const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, "Hekim Portföyü");
                XLSX.writeFile(wb, `Seviye_Dental_CRM_Yedek_${new Date().toISOString().split('T')[0]}.xlsx`);
            };

            const handleLoginSubmit = (e) => {
                e.preventDefault(); const matchedUser = systemUsers.find(u => u.username === loginForm.username && u.password === loginForm.password);
                if (matchedUser) { setIsLoggedIn(true); setCurrentUser(matchedUser.name); localStorage.setItem('crm_user_session', matchedUser.name); setLoginForm({ username: '', password: '' }); } else { alert("❌ Hatalı Kullanıcı Adı veya Şifre!"); }
            };

            const handleLogoutAction = () => { setIsLoggedIn(false); setCurrentUser(''); localStorage.removeItem('crm_user_session'); };
            const handleDragStart = (id) => setDraggedRegionId(id);
            const handleDrop = async (targetId) => {
                if (!draggedRegionId || draggedRegionId === targetId) return;
                const { doc, updateDoc } = window.FirebaseMethods;
                const draggedIdx = regions.findIndex(r => r.id === draggedRegionId); const targetIdx = regions.findIndex(r => r.id === targetId);
                const updated = [...regions]; const [removed] = updated.splice(draggedIdx, 1); updated.splice(targetIdx, 0, removed);
                updated.forEach((r, idx) => { updateDoc(doc(window.db, 'shared_regions', r.id), { order: idx }); });
            };

            const toggleTodayVisit = async (docItem) => {
                const { doc, updateDoc } = window.FirebaseMethods;
                await updateDoc(doc(window.db, 'shared_doctors', docItem.id), { visitToday: !docItem.visitToday });
            };

            const handleAddDoctor = async (e) => {
                e.preventDefault(); if (!doctorForm.name || !doctorForm.regionId) return;
                const { collection, addDoc, doc, updateDoc } = window.FirebaseMethods;
                
                if (editingDoctorId) {
                    await updateDoc(doc(window.db, 'shared_doctors', editingDoctorId), { name: doctorForm.name, phone: doctorForm.phone, clinic: doctorForm.clinic, regionId: doctorForm.regionId, visitToday: !!doctorForm.visitToday });
                } else {
                    const docRef = await addDoc(collection(window.db, 'shared_doctors'), {
                        name: doctorForm.name, phone: doctorForm.phone, clinic: doctorForm.clinic, regionId: doctorForm.regionId, visitToday: !!doctorForm.visitToday, lastVisitStatus: 'none', lastVisitTime: 0, timestamp: Date.now()
                    });
                    await createLog('add_doctor', `"${doctorForm.name}" isimli yeni hekim portföye eklendi.`, [docRef.id]);
                    if (doctorForm.note) {
                        await addDoc(collection(window.db, 'shared_visits'), { doctorId: docRef.id, text: doctorForm.note, rawText: doctorForm.note, date: new Date().toLocaleString('tr-TR'), timestamp: Date.now(), user: currentUser, status: 'success' });
                    }
                }
                setShowModal(false); setEditingDoctorId(null); setDoctorForm({ name: '', phone: '', clinic: '', regionId: '', note: '', visitToday: false });
            };

            const handleStartEditDoctor = (docItem) => {
                setEditingDoctorId(docItem.id); setDoctorForm({ name: docItem.name, phone: docItem.phone || '', clinic: docItem.clinic || '', regionId: docItem.regionId, visitToday: !!docItem.visitToday, note: '' });
                setModalType('doctor'); setShowModal(true);
            };

            const handleAddRegion = async (e) => {
                e.preventDefault(); if (!regionForm.name) return;
                const { collection, addDoc } = window.FirebaseMethods;
                await addDoc(collection(window.db, 'shared_regions'), { name: regionForm.name, order: regions.length });
                setShowModal(false); setRegionForm({ name: '' });
            };

            const handleAddUser = async (e) => {
                e.preventDefault(); if (!userForm.username || !userForm.password || !userForm.name) return;
                const { collection, addDoc } = window.FirebaseMethods;
                await addDoc(collection(window.db, 'shared_users'), { username: userForm.username, password: userForm.password, name: userForm.name });
                setShowModal(false); setUserForm({ username: '', password: '', name: '' });
            };

            const handleDeleteUser = async (id) => {
                if (!confirm("Bu kullanıcının sistem erişimini kaldırmak istediğinize emin misiniz?")) return;
                const { doc, deleteDoc } = window.FirebaseMethods; await deleteDoc(doc(window.db, 'shared_users', id));
            };

            const handleSaveNote = async (docId) => {
                if (!newNoteText.trim()) return;
                const { collection, addDoc, doc, updateDoc } = window.FirebaseMethods;
                let reminderInfo = ""; let emailRem = reminderEmail || null; let emailDt = null;
                if (reminderDate && reminderEmail) {
                    emailDt = new Date(reminderDate).toLocaleString('tr-TR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
                    reminderInfo = ` [M-Hatırlatıcı: ${emailDt} saatinde ${reminderEmail} adresine gönderilecek]`;
                }
                let noteId = "";
                if (editingNoteId) {
                    await updateDoc(doc(window.db, 'shared_visits', editingNoteId), { text: newNoteText + reminderInfo, rawText: newNoteText, emailReminder: emailRem, emailDate: emailDt, user: currentUser, status: visitStatus });
                    noteId = editingNoteId;
                } else {
                    const noteRef = await addDoc(collection(window.db, 'shared_visits'), { doctorId: docId, text: newNoteText + reminderInfo, rawText: newNoteText, date: new Date().toLocaleString('tr-TR'), timestamp: Date.now(), emailReminder: emailRem, emailDate: emailDt, user: currentUser, status: visitStatus });
                    noteId = noteRef.id;
                }
                await updateDoc(doc(window.db, 'shared_doctors', docId), { lastVisitStatus: visitStatus, lastVisitTime: Date.now() });
                
                const docName = doctors.find(d => d.id === docId)?.name || "Bilinmeyen Hekim";
                await createLog('add_note', `"${docName}" için yeni saha ziyareti notu düşüldü.`, [noteId]);

                setNewNoteText(''); setReminderEmail(''); setEditingNoteId(null); setReminderDate(getTenDaysLaterISO()); setVisitStatus('success');
            };

            const handleStartEditNote = (note) => {
                setEditingNoteId(note.id); setNewNoteText(note.rawText || note.text.split(" [M-Hatırlatıcı:")[0]);
                setReminderEmail(note.emailReminder || ''); setVisitStatus(note.status || 'success');
                if (note.emailDate) {
                    const parts = note.emailDate.split(' '); const dateParts = parts[0].split('.');
                    setReminderDate(`${dateParts[2]}-${dateParts[1]}-${dateParts[0]}T${parts[1]}`);
                } else { setReminderDate(''); }
            };

            const handleDeleteNote = async (noteId) => {
                if (!confirm("Bu notu silmek istediğinize emin misiniz?")) return;
                const { doc, deleteDoc } = window.FirebaseMethods; await deleteDoc(doc(window.db, 'shared_visits', noteId));
            };

            const handleDeleteDoctor = async (id) => {
                const targetDoc = doctors.find(d => d.id === id);
                if (confirm(`"${targetDoc?.name}" hekimini silmek istediğinize emin misiniz?`)) {
                    const { doc, deleteDoc, collection, addDoc } = window.FirebaseMethods;
                    
                    // Geri yükleme ihtimaline karşı silinen veriyi kopyala ve logla
                    const logRef = await addDoc(collection(window.db, 'shared_logs'), {
                        user: currentUser, type: 'delete_doctor', details: `"${targetDoc?.name}" portföyden silindi.`, backupData: targetDoc, date: new Date().toLocaleString('tr-TR'), timestamp: Date.now()
                    });

                    await deleteDoc(doc(window.db, 'shared_doctors', id));
                }
            };

            const cleanTurkish = (str) => String(str).toLocaleLowerCase('tr-TR').replace(/ğ/g, 'g').replace(/ü/g, 'u').replace(/ş/g, 's').replace(/ı/g, 'i').replace(/ö/g, 'o').replace(/ç/g, 'c');

            const filteredDoctors = useMemo(() => {
                const todayStr = new Date().toLocaleDateString('tr-TR');
                const fourteenDaysAgo = Date.now() - 14 * 24 * 60 * 60 * 1000;
                return doctors.filter(doc => {
                    if (activeRegion === 'failed_visits_panel') return doc.lastVisitStatus === 'fail' && doc.lastVisitTime >= fourteenDaysAgo;
                    if (activeRegion === 'success_visits_panel') return doc.lastVisitStatus === 'success' && doc.lastVisitTime >= fourteenDaysAgo;
                    if (activeRegion === 'report_panel') return doctorVisits.some(v => v.doctorId === doc.id && v.date && v.date.split(' ')[0] === todayStr);
                    if (activeRegion === 'today_panel') {
                        const hasTodayReminder = doctorVisits.filter(v => v.doctorId === doc.id).some(v => v.emailDate && v.emailDate.split(' ')[0] === todayStr);
                        return doc.visitToday || hasTodayReminder;
                    }
                    const matchesRegion = activeRegion === 'all' || doc.regionId === activeRegion;
                    const searchTarget = cleanTurkish(doc.name) + " " + cleanTurkish(doc.clinic || '');
                    return matchesRegion && searchTarget.includes(cleanTurkish(searchTerm));
                });
            }, [doctors, activeRegion, searchTerm, doctorVisits]);

            const handleTabSelect = (tabId) => { setActiveRegion(tabId); setIsMobileMenuOpen(false); };

            if (!fbReady) return <div className="min-h-screen flex items-center justify-center bg-slate-900 text-blue-500 font-black animate-pulse">ORTAK BULUT VERİ TABANINA BAĞLANILIYOR...</div>;

            if (!isLoggedIn) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-slate-900 p-4">
                        <div className="w-full max-w-md bg-white rounded-[2.5rem] shadow-2xl p-10 animate-in">
                            <form onSubmit={handleLoginSubmit} className="space-y-4">
                                <h1 className="text-2xl font-black text-center text-slate-800">Seviye Dental <span className="text-blue-600">CRM</span></h1>
                                <input type="text" required className="w-full p-4 bg-slate-50 border rounded-2xl font-bold" placeholder="Kullanıcı Adı" value={loginForm.username} onChange={e => setLoginForm({...loginForm, username: e.target.value})} />
                                <input type="password" required className="w-full p-4 bg-slate-50 border rounded-2xl font-bold" placeholder="Şifre" value={loginForm.password} onChange={e => setLoginForm({...loginForm, password: e.target.value})} />
                                <button type="submit" className="w-full py-4 bg-blue-600 text-white font-black rounded-2xl uppercase">Sisteme Giriş Yap</button>
                            </form>
                        </div>
                    </div>
                );
            }

            return (
                <div className="flex flex-col lg:flex-row min-h-screen relative">
                    {isMobileMenuOpen && <div onClick={() => setIsMobileMenuOpen(false)} className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-40 lg:hidden"></div>}

                    <aside className="sidebar w-72 bg-slate-900 text-slate-400 p-6 flex flex-col h-screen fixed top-0 left-0 z-50 shadow-2xl transition-transform duration-300 lg:translate-x-0 (isMobileMenuOpen ? 'translate-x-0' : '-translate-x-full lg:fixed')">
                        <div className="flex items-center justify-between mb-6 px-2">
                            <h1 className="text-xl font-extrabold text-white">Seviye<span className="text-blue-500">CRM</span></h1>
                            <button onClick={() => setIsMobileMenuOpen(false)} className="lg:hidden p-2 text-slate-400 border border-slate-700 rounded-xl"><Icon name="x" size={16} /></button>
                        </div>

                        <div className="space-y-1 overflow-y-auto flex-1 pr-1 custom-scrollbar">
                            <button onClick={() => handleTabSelect('today_panel')} className={`w-full flex items-center justify-between px-4 py-3 rounded-xl font-bold text-sm ${activeRegion === 'today_panel' ? 'bg-amber-500 text-white' : 'bg-slate-800/40 text-amber-400'}`}><span className="flex items-center gap-3"><Icon name="calendar-check" size={18} /> Bugün Gezilecekler</span></button>
                            <button onClick={() => handleTabSelect('report_panel')} className={`w-full flex items-center justify-between px-4 py-3 rounded-xl font-bold text-sm ${activeRegion === 'report_panel' ? 'bg-emerald-600 text-white' : 'bg-slate-800/40 text-emerald-400'}`}><span className="flex items-center gap-3"><Icon name="file-text" size={18} /> Akşam Saha Raporu</span></button>

                            <div className="pt-2 pb-1 px-2"><h2 className="text-[10px] font-black uppercase text-slate-500 tracking-wider">2 Haftalık Durum Takibi</h2></div>
                            <button onClick={() => handleTabSelect('failed_visits_panel')} className={`w-full flex items-center justify-between px-4 py-2.5 rounded-xl font-bold text-xs ${activeRegion === 'failed_visits_panel' ? 'bg-red-600 text-white' : 'bg-slate-800/40 text-red-400'}`}><span className="flex items-center gap-3"><Icon name="phone-off" size={14} /> 🔴 Tekrar Uğranacaklar</span></button>
                            <button onClick={() => handleTabSelect('success_visits_panel')} className={`w-full flex items-center justify-between px-4 py-2.5 rounded-xl font-bold text-xs mb-4 ${activeRegion === 'success_visits_panel' ? 'bg-indigo-600 text-white' : 'bg-slate-800/40 text-indigo-400'}`}><span className="flex items-center gap-3"><Icon name="check-circle" size={14} /> 🟢 Nadasa Bırakılanlar</span></button>

                            {/* ⏳ YENİ MENÜ ELEMANI: SİSTEM LOGLARI PANEL GİRİŞİ (Yalnızca Yönetici Görür) */}
                            {currentUser === 'Yönetici' && (
                                <button onClick={() => handleTabSelect('logs_panel')} className={`w-full flex items-center gap-3 px-4 py-3 bg-red-950/20 text-red-400 border border-red-900/30 rounded-xl font-bold text-sm mb-4 ${activeRegion === 'logs_panel' ? 'bg-red-900 text-white' : ''}`}>
                                    <Icon name="shield-alert" size={18} /> 🛡️ Güvenlik & Sistem Logları
                                </button>
                            )}

                            <div className="flex items-center justify-between mb-2 px-2 border-t border-slate-800 pt-3"><h2 className="text-xs font-black uppercase text-slate-400 tracking-wider">Bölgeler / Rotalar</h2><button onClick={() => { setModalType('region'); setEditingDoctorId(null); setShowModal(true); }} className="p-1 text-blue-400"><Icon name="plus" size={18} /></button></div>
                            <button onClick={() => handleTabSelect('all')} className={`w-full flex items-center justify-between px-4 py-3 rounded-xl font-bold text-sm ${activeRegion === 'all' ? 'bg-blue-600 text-white' : 'text-slate-400'}`}><span className="flex items-center gap-3"><Icon name="globe" size={18} /> Tüm Hekimler</span></button>
                            {regions.map(reg => (
                                <div key={reg.id} onClick={() => handleTabSelect(reg.id)} className={`w-full flex items-center justify-between px-4 py-3 rounded-xl font-bold text-sm ${activeRegion === reg.id ? 'bg-blue-600 text-white' : 'text-slate-400'}`}><span className="flex items-center gap-3 truncate"><Icon name="map-pin" size={16} /><span className="truncate">{reg.name}</span></span></div>
                            ))}

                            <div className="mt-4 pt-4 border-t border-slate-800 space-y-1">
                                <button onClick={() => handleTabSelect('users_panel')} className="w-full flex items-center gap-3 px-4 py-3 rounded-xl font-bold text-sm text-slate-400 hover:bg-slate-800"><Icon name="settings" size={18} /> Ekip & Şifre Yönetimi</button>
                                <button onClick={() => { setModalType('bulk_nav'); setShowModal(true); }} className="w-full flex items-center gap-3 px-4 py-2.5 bg-blue-950/40 text-blue-400 font-bold text-xs rounded-xl"><Icon name="map" size={16} /> Haritadan Toplu Aktar</button>
                                <button onClick={handleExcelExport} className="w-full flex items-center gap-3 px-4 py-2.5 rounded-xl font-bold text-xs text-emerald-400"><Icon name="file-spreadsheet" size={16} /> Excel Portföy İndir</button>
                                <button onClick={() => fileInputRef.current.click()} className="w-full flex items-center gap-3 px-4 py-2.5 rounded-xl font-bold text-xs text-blue-400"><Icon name="upload" size={16} /> Excel'den Toplu Yükle</button>
                                <input type="file" ref={fileInputRef} onChange={handleExcelImport} accept=".xlsx, .xls" className="hidden" />
                            </div>
                        </div>
                    </aside>

                    <main className="main-content flex-1 lg:ml-72 p-4 lg:p-10 bg-slate-50 min-h-screen pb-24">
                        {activeRegion === 'users_panel' ? (
                            <div className="space-y-6 animate-in">
                                <header className="flex justify-between items-center mb-6">
                                    <h2 className="text-2xl font-extrabold text-slate-800">Saha Ekibi & Şifre Yönetimi</h2>
                                    <button onClick={() => { setModalType('user'); setShowModal(true); }} className="px-5 py-3 bg-blue-600 text-white font-bold text-xs uppercase rounded-xl">+ Yeni Temsilci Ekle</button>
                                </header>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                    {systemUsers.map(u => (
                                        <div key={u.id} className="bg-white p-6 rounded-3xl border shadow-sm">
                                            <h4 className="text-lg font-black text-slate-800">{u.name}</h4>
                                            <p className="text-xs text-slate-400 font-bold">Kullanıcı: {u.username} | Şifre: {u.password}</p>
                                            {u.username !== 'admin' && <button onClick={() => handleDeleteUser(u.id)} className="w-full mt-4 py-2 bg-red-50 text-red-500 text-xs font-bold rounded-xl">Hesabı Kaldır</button>}
                                        </div>
                                    ))}
                                </div>
                            </div>
                        ) : activeRegion === 'logs_panel' ? (
                            /* 🛡️ YENİ EKRAN GÖRÜNÜMÜ: SİSTEM LOGLARI VE KUSURSUZ GERİ ALMA ALANI */
                            <div className="space-y-6 animate-in">
                                <header className="mb-6">
                                    <h2 className="text-2xl font-extrabold text-slate-800">🛡️ Sistem Güvenlik & İşlem Logları</h2>
                                    <p className="text-xs font-bold text-red-500 uppercase tracking-widest mt-1">Sistem üzerinde yapılan tüm işlemler ve tek tıkla geri alma paneli</p>
                                </header>
                                <div className="bg-white rounded-[2rem] border p-6 shadow-sm">
                                    <div className="space-y-4">
                                        {systemLogs.map(log => (
                                            <div key={log.id} className="flex flex-col sm:flex-row justify-between items-start sm:items-center bg-slate-50 p-4 rounded-2xl border gap-4 transition-all hover:bg-slate-100/50">
                                                <div>
                                                    <div className="flex items-center gap-2 mb-1">
                                                        <span className="text-[10px] font-black uppercase bg-slate-900 text-white px-2 py-0.5 rounded">{log.user}</span>
                                                        <span className="text-[9px] font-bold text-slate-400">⏱️ {log.date}</span>
                                                    </div>
                                                    <p className="text-xs font-extrabold text-slate-700">"{log.details}"</p>
                                                </div>
                                                {/* GERİ ALMA BUTONU */}
                                                <button onClick={() => handleUndoAction(log)} className="py-2 px-4 bg-red-50 hover:bg-red-600 text-red-600 hover:text-white transition-all text-xs font-black rounded-xl border border-red-200 uppercase tracking-wider flex items-center gap-1">
                                                    <Icon name="rotate-ccw" size={14} /> İşlemi Geri Al (Undo)
                                                </button>
                                            </div>
                                        ))}
                                        {systemLogs.length === 0 && <p className="text-center py-8 text-slate-400 italic text-sm">Sistemde henüz bir işlem kaydı bulunmuyor.</p>}
                                    </div>
                                </div>
                            </div>
                        ) : activeRegion === 'report_panel' ? (
                            <div className="space-y-6 animate-in">
                                <header className="mb-6"><h2 className="text-2xl font-extrabold text-slate-800">📋 Bugünün Saha Ziyaret Raporu</h2></header>
                                <div className="bg-white rounded-[2rem] border p-6 shadow-sm overflow-hidden">
                                    <table className="w-full text-left border-collapse">
                                        <thead><tr className="border-b text-[10px] font-black uppercase text-slate-400"><th className="py-4 px-4">Hekim Adı</th><th className="py-4 px-4">Klinik</th><th className="py-4 px-4">Bölge</th><th className="py-4 px-4">Ziyaret Notu</th></tr></thead>
                                        <tbody className="divide-y text-xs font-bold text-slate-700">
                                            {filteredDoctors.map(doc => {
                                                const todayStr = new Date().toLocaleDateString('tr-TR');
                                                const todayVisits = doctorVisits.filter(v => v.doctorId === doc.id && v.date && v.date.split(' ')[0] === todayStr);
                                                return todayVisits.map((v, index) => (
                                                    <tr key={v.id} className="hover:bg-slate-50">
                                                        {index === 0 ? (
                                                            <><td className="py-4 px-4 font-extrabold text-slate-900" rowSpan={todayVisits.length}>{doc.name}</td><td className="py-4 px-4 text-slate-500" rowSpan={todayVisits.length}>{doc.clinic || '-'}</td><td className="py-4 px-4" rowSpan={todayVisits.length}><span className="bg-slate-100 text-slate-600 px-2 py-0.5 rounded">{regions.find(r => r.id === doc.regionId)?.name}</span></td></>
                                                        ) : null}
                                                        <td className="py-4 px-4 border-l bg-emerald-50/30"><p>"{v.rawText || v.text}"</p><div className="flex gap-2 mt-1 text-[9px] font-black"><span className="text-slate-400">⏱ {v.date.split(' ')[1]}</span><span className="text-blue-600">👤 {v.user}</span></div></td>
                                                    </tr>
                                                ));
                                            })}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        ) : (
                            <>
                                <div className="flex justify-between items-center mb-6">
                                    <h2 className="text-2xl font-extrabold text-slate-800">Saha Portföy Listesi</h2>
                                    <button onClick={() => { setModalType('doctor'); setEditingDoctorId(null); setDoctorForm({ name: '', phone: '', clinic: '', regionId: '', note: '', visitToday: false }); setShowModal(true); }} className="px-4 py-2.5 bg-blue-600 text-white font-bold text-xs uppercase rounded-xl">+ Ekle</button>
                                </div>
                                <div className="mb-6 relative">
                                    <input type="text" placeholder="Hekim adı veya klinik aratın..." className="w-full pl-12 pr-4 py-4 bg-white border rounded-2xl outline-none shadow-sm" value={searchTerm} onChange={e => setSearchTerm(e.target.value)}/>
                                    <div className="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"><Icon name="search" size={20} /></div>
                                </div>
                                <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6">
                                    {filteredDoctors.map(doc => {
                                        const lastVisit = doctorVisits.find(v => v.doctorId === doc.id);
                                        return (
                                            <div key={doc.id} className={`bg-white rounded-3xl border-l-8 p-6 flex flex-col justify-between shadow-sm border-y border-r border-slate-100 ${doc.lastVisitStatus === 'success' ? 'border-l-green-500' : doc.lastVisitStatus === 'fail' ? 'border-l-red-500' : 'border-l-slate-300'}`}>
                                                <div>
                                                    <div className="flex justify-between items-start mb-4">
                                                        <div className="bg-blue-50 text-blue-600 p-3 rounded-2xl"><Icon name="user-round" size={24} /></div>
                                                        <button onClick={(e) => { e.stopPropagation(); toggleTodayVisit(doc); }} className="text-[10px] font-black uppercase bg-slate-100 text-slate-600 px-2.5 py-1 rounded-md">{doc.visitToday ? '🌟 Listemde' : '➕ Ekle'}</button>
                                                    </div>
                                                    <h3 className="text-lg font-extrabold text-slate-800 mb-1">{doc.name}</h3>
                                                    {doc.clinic && <p className="text-xs text-slate-400 font-bold mb-1">🏢 {doc.clinic}</p>}
                                                    {doc.phone && <p className="text-xs text-slate-400 font-bold mb-2">📞 {doc.phone}</p>}
                                                    <div className="bg-slate-50 rounded-xl p-3 border mt-3 text-xs">
                                                        {lastVisit ? <p className="font-bold text-slate-700">"{lastVisit.rawText || lastVisit.text}"</p> : <p className="text-slate-400 italic">Not alınmamış.</p>}
                                                    </div>
                                                </div>
                                                <div className="flex gap-2 mt-4">
                                                    <button onClick={() => { setSelectedDoctor(doc); setEditingNoteId(null); setNewNoteText(''); setVisitStatus(doc.lastVisitStatus || 'success'); }} className="flex-1 py-2.5 bg-slate-900 text-white font-bold text-xs rounded-xl">Detay & Notlar</button>
                                                    <button onClick={() => handleStartEditDoctor(doc)} className="p-2.5 bg-blue-50 text-blue-600 rounded-xl"><Icon name="pencil" size={16}/></button>
                                                    <button onClick={() => handleDeleteDoctor(doc.id)} className="p-2.5 bg-red-50 text-red-500 rounded-xl"><Icon name="trash-2" size={16}/></button>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </>
                        )}
                    </main>

                    {/* MODAL SİSTEMLERİ */}
                    {selectedDoctor && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-md z-[150] flex items-center justify-center p-4">
                            <div className="bg-white rounded-[2.5rem] shadow-2xl w-full max-w-xl p-6 sm:p-8 animate-in">
                                <div className="flex justify-between items-center mb-4">
                                    <h3 className="text-xl font-extrabold text-slate-900">{selectedDoctor.name} Günlüğü</h3>
                                    <button onClick={() => { setSelectedDoctor(null); setEditingNoteId(null); setNewNoteText(''); }} className="p-2 border rounded-xl"><Icon name="x" size={18} /></button>
                                </div>
                                <div className="space-y-4 max-h-[70vh] overflow-y-auto pr-1 custom-scrollbar">
                                    <div className="space-y-3 bg-slate-50 p-4 rounded-2xl border">
                                        <textarea placeholder="Ziyaret notunu girin..." className="w-full p-3 border rounded-xl text-xs font-bold h-16 bg-white" value={newNoteText} onChange={e => setNewNoteText(e.target.value)} />
                                        <div className="grid grid-cols-2 gap-2">
                                            <button type="button" onClick={() => setVisitStatus('success')} className={`py-2 px-3 rounded-xl text-xs font-black uppercase tracking-wider border transition-all ${visitStatus === 'success' ? 'bg-green-600 text-white' : 'bg-white'}`}>Görüşme Sağlandı</button>
                                            <button type="button" onClick={() => setVisitStatus('fail')} className={`py-2 px-3 rounded-xl text-xs font-black uppercase tracking-wider border transition-all ${visitStatus === 'fail' ? 'bg-red-600 text-white' : 'bg-white'}`}>Görüşme Sağlanamadı</button>
                                        </div>
                                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-2 pt-1">
                                            <div><input type="datetime-local" className="w-full p-2 bg-white border rounded-lg text-xs font-bold" value={reminderDate} onChange={e => setReminderDate(e.target.value)} /></div>
                                            <div><input type="email" placeholder="Hatırlatılacak E-Posta" className="w-full p-2 bg-white border rounded-lg text-xs font-bold" value={reminderEmail} onChange={e => setReminderEmail(e.target.value)} /></div>
                                        </div>
                                        <button type="button" onClick={async () => { await handleSaveNote(selectedDoctor.id); }} className="w-full py-2.5 bg-blue-600 text-white font-black text-xs uppercase rounded-xl">Kaydet</button>
                                    </div>
                                    <div className="space-y-2 pt-4 border-t">
                                        {doctorVisits.filter(v => v.doctorId === selectedDoctor.id).map(n => (
                                            <div key={n.id} className="bg-slate-50 p-4 rounded-2xl border"><span className="text-[9px] font-black text-blue-500 block">{n.date}</span><p className="text-xs font-bold text-slate-700 mt-1.5">"{n.rawText || n.text}"</p></div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {showModal && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-md z-[150] flex items-center justify-center p-4">
                            <div className="bg-white rounded-[2.5rem] shadow-2xl w-full max-w-md p-8 animate-in">
                                <div className="flex justify-between items-center mb-6">
                                    <h3 className="text-lg font-extrabold text-slate-900 uppercase">{modalType === 'doctor' ? 'Hekim Kartı' : modalType === 'region' ? 'Yeni Rota' : modalType === 'bulk_nav' ? 'Haritadan Aktar' : 'Yeni Kullanıcı'}</h3>
                                    <button onClick={() => { setShowModal(false); setEditingDoctorId(null); }} className="p-2 border rounded-xl"><Icon name="x" size={16} /></button>
                                </div>
                                {modalType === 'bulk_nav' && (
                                    <form onSubmit={handleBulkNavParse} className="space-y-4">
                                        <textarea required placeholder="Harita verilerini buraya yapıştırın..." className="w-full p-4 border rounded-2xl font-bold text-xs h-48 bg-slate-50" value={bulkNavText} onChange={e => setBulkNavText(e.target.value)} />
                                        <button type="submit" className="w-full py-4 bg-blue-600 text-white font-black text-xs uppercase rounded-xl">Hekimleri Ekle</button>
                                    </form>
                                )}
                                {modalType === 'doctor' && (
                                    <form onSubmit={handleAddDoctor} className="space-y-4">
                                        <input type="text" required placeholder="Hekim Adı Soyadı" className="w-full p-4 border rounded-xl font-bold text-sm outline-none" value={doctorForm.name} onChange={e => setDoctorForm({...doctorForm, name: e.target.value})} />
                                        <input type="text" placeholder="Klinik / Hastane" className="w-full p-4 border rounded-xl font-bold text-sm outline-none" value={doctorForm.clinic} onChange={e => setDoctorForm({...doctorForm, clinic: e.target.value})} />
                                        <input type="text" placeholder="Telefon Numarası" className="w-full p-4 border rounded-xl font-bold text-sm outline-none" value={doctorForm.phone} onChange={e => setDoctorForm({...doctorForm, phone: e.target.value})} />
                                        <select required className="w-full p-4 border rounded-xl font-bold text-sm bg-slate-50" value={doctorForm.regionId} onChange={e => setDoctorForm({...doctorForm, regionId: e.target.value})}><option value="">Bölge / Rota Seçin...</option>{regions.map(r => <option key={r.id} value={r.id}>{r.name}</option>)}</select>
                                        <button type="submit" className="w-full py-4 bg-blue-600 text-white font-black text-xs uppercase rounded-xl">{editingDoctorId ? 'Değişiklikleri Kaydet' : 'Hekimi Ekle'}</button>
                                    </form>
                                )}
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
