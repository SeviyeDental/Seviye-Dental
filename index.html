<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seviye Dental - Ortak Saha Satış & CRM Sistemi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, doc, collection, query, onSnapshot, addDoc, updateDoc, deleteDoc, orderBy } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        
        const firebaseConfig = {
            apiKey: "AIzaSyCJJP857pMmLoCc7CMzswHNwTp_TAybMdE",
            authDomain: "webapp-d239c.firebaseapp.com",
            projectId: "webapp-d239c",
            storageBucket: "webapp-d239c.firebasestorage.app",
            messagingSenderId: "965046349663",
            appId: "1:965046349663:web:dbdda634472521accad0ea"
        };

        const app = initializeApp(firebaseConfig);
        window.db = getFirestore(app);
        window.FirebaseMethods = { doc, collection, query, onSnapshot, addDoc, updateDoc, deleteDoc, orderBy };
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #F8FAFC; color: #0F172A; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 20px; }
    </style>
</head>
<body class="bg-slate-50 antialiased">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        const Icon = ({ name, size = 20, className = "" }) => {
            const iconRef = useRef(null);
            useEffect(() => {
                if (iconRef.current && window.lucide) {
                    iconRef.current.innerHTML = "";
                    const iconElement = document.createElement('i');
                    iconElement.setAttribute('data-lucide', name);
                    iconElement.style.width = `${size}px`;
                    iconElement.style.height = `${size}px`;
                    if (className) iconElement.className = className;
                    iconRef.current.appendChild(iconElement);
                    window.lucide.createIcons();
                }
            }, [name, size, className]);
            return <span ref={iconRef} className="inline-flex items-center justify-center"></span>;
        };const App = () => {
            const [isLoggedIn, setIsLoggedIn] = useState(() => !!localStorage.getItem('crm_user_session'));
            const [currentUser, setCurrentUser] = useState(() => localStorage.getItem('crm_user_session') || '');
            const [loginForm, setLoginForm] = useState({ username: '', password: '' });
            const [systemUsers, setSystemUsers] = useState([]);

            const [regions, setRegions] = useState([]);
            const [doctors, setDoctors] = useState([]);
            const [doctorVisits, setDoctorVisits] = useState([]);
            const [fbReady, setFbReady] = useState(false);

            const [activeRegion, setActiveRegion] = useState('all');
            const [searchTerm, setSearchTerm] = useState('');
            const [showModal, setShowModal] = useState(false);
            const [modalType, setModalType] = useState(''); 
            const [selectedDoctor, setSelectedDoctor] = useState(null);
            const [draggedRegionId, setDraggedRegionId] = useState(null);
            const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);

            const [doctorForm, setDoctorForm] = useState({ name: '', phone: '', clinic: '', regionId: '', note: '', visitToday: false });
            const [editingDoctorId, setEditingDoctorId] = useState(null);
            
            const [regionForm, setRegionForm] = useState({ name: '' });
            const [userForm, setUserForm] = useState({ username: '', password: '', name: '' });
            const [newNoteText, setNewNoteText] = useState('');
            
            const [editingNoteId, setEditingNoteId] = useState(null);
            const [reminderDate, setReminderDate] = useState(''); 
            const [reminderEmail, setReminderEmail] = useState('');
            const [visitStatus, setVisitStatus] = useState('success');

            // Navigasyon Kopyala-Yapıştır için yeni metin alanı durumu
            const [bulkNavText, setBulkNavText] = useState('');

            const fileInputRef = useRef(null);

            const getTenDaysLaterISO = () => {
                const now = new Date();
                const tenDaysLater = new Date(now.getTime() + 10 * 24 * 60 * 60 * 1000);
                const tzoffset = tenDaysLater.getTimezoneOffset() * 60000;
                return new Date(tenDaysLater.getTime() - tzoffset).toISOString().slice(0, 16);
            };

            useEffect(() => {
                if (!isLoggedIn) return;
                let timeoutId; const idleTime = 2 * 60 * 1000;
                const resetTimer = () => { clearTimeout(timeoutId); timeoutId = setTimeout(handleLogout, idleTime); };
                const handleLogout = () => {
                    setIsLoggedIn(false); setCurrentUser(''); localStorage.removeItem('crm_user_session');
                    alert("🚨 2 dakika boyunca işlem yapılmadığı için oturumunuz kapatılmıştır.");
                };
                const events = ['mousemove', 'mousedown', 'click', 'scroll', 'keypress', 'touchstart'];
                events.forEach(event => window.addEventListener(event, resetTimer));
                resetTimer();
                return () => { clearTimeout(timeoutId); events.forEach(event => window.removeEventListener(event, resetTimer)); };
            }, [isLoggedIn]);

            useEffect(() => {
                const checkInterval = setInterval(() => {
                    if (window.db && window.FirebaseMethods) {
                        clearInterval(checkInterval);
                        const { collection, query, onSnapshot, orderBy } = window.FirebaseMethods;
                        onSnapshot(query(collection(window.db, 'shared_regions'), orderBy('order', 'asc')), (s) => setRegions(s.docs.map(d => ({ ...d.data(), id: d.id }))));
                        onSnapshot(collection(window.db, 'shared_doctors'), (s) => setDoctors(s.docs.map(d => ({ ...d.data(), id: d.id }))));
                        onSnapshot(query(collection(window.db, 'shared_visits'), orderBy('timestamp', 'desc')), (s) => setDoctorVisits(s.docs.map(d => ({ ...d.data(), id: d.id }))));
                        onSnapshot(collection(window.db, 'shared_users'), (s) => setSystemUsers(s.docs.map(d => ({ ...d.data(), id: d.id }))));
                        setFbReady(true);
                    }
                }, 100);
                return () => clearInterval(checkInterval);
            }, []);

            useEffect(() => { if (selectedDoctor && !editingNoteId) setReminderDate(getTenDaysLaterISO()); }, [selectedDoctor, editingNoteId]);

            // 🗺️ YENİ: NAVİGASYONDAN KOPYALA-YAPIŞTIR AKILLI AYIKLAMA MOTORU
            const handleBulkNavParse = async (e) => {
                e.preventDefault();
                if (!bulkNavText.trim()) return;

                const lines = bulkNavText.split('\n');
                const { collection, addDoc } = window.FirebaseMethods;
                let defaultRegionId = regions[0]?.id || 'reg-1';
                let addedCount = 0;

                let currentName = "";
                let currentPhone = "";
                let currentClinic = "";

                for (let i = 0; i < lines.length; i++) {
                    const line = lines[i].trim();
                    if (!line) continue;

                    // Telefon numarası ayıklama kalıbı (05xx, 02xx vb.)
                    const phoneMatch = line.match(/(0\s?\d{3}\s?\d{3}\s?\d{2}\s?\d{2})|(\+90\d{10})|(\d{7,11})/);

                    if (phoneMatch) {
                        currentPhone = phoneMatch[0];
                    } else if (line.toLowerCase().includes('diş') || line.toLowerCase().includes('poliklini') || line.toLowerCase().includes('muayene') || line.toLowerCase().includes('dt.')) {
                        // Eğer eski birikmiş bir kayıt varsa önce onu buluta gönder
                        if (currentName) {
                            await addDoc(collection(window.db, 'shared_doctors'), {
                                name: currentName, clinic: currentClinic || currentName, phone: currentPhone || '-', regionId: defaultRegionId, visitToday: false, lastVisitStatus: 'none', lastVisitTime: 0, timestamp: Date.now()
                            });
                            addedCount++;
                            currentPhone = ""; currentClinic = "";
                        }
                        currentName = line;
                    } else if (line.length > 5 && line.length < 50 && !currentClinic) {
                        currentClinic = line;
                    }

                    // Son kalan kaydı da döngü bitiminde ekle
                    if (i === lines.length - 1 && currentName) {
                        await addDoc(collection(window.db, 'shared_doctors'), {
                            name: currentName, clinic: currentClinic || currentName, phone: currentPhone || '-', regionId: defaultRegionId, visitToday: false, lastVisitStatus: 'none', lastVisitTime: 0, timestamp: Date.now()
                        });
                        addedCount++;
                    }
                }

                alert(`🎯 Harita verisi başarıyla tarandı! ${addedCount} adet yeni özel klinik ortak havuzunuza eklendi.`);
                setBulkNavText('');
                setShowModal(false);
            };

            const handleExcelImport = (e) => {
                const file = e.target.files[0]; if (!file) return;
                const reader = new FileReader();
                reader.onload = async (evt) => {
                    const data = XLSX.utils.sheet_to_json(XLSX.read(evt.target.result, { type: 'binary' }).Sheets[wb.SheetNames[0]]);
                    const { collection, addDoc } = window.FirebaseMethods;
                    let defaultRegionId = regions[0]?.id || 'reg-1';
                    for (const row of data) {
                        if (row["Hekim Adı Soyadı"]) {
                            await addDoc(collection(window.db, 'shared_doctors'), {
                                name: row["Hekim Adı Soyadı"], clinic: row["Klinik"] || '', phone: row["Telefon"] || '', regionId: defaultRegionId, visitToday: false, lastVisitStatus: 'none', lastVisitTime: 0, timestamp: Date.now()
                            });
                        }
                    }
                    alert(`✅ Hekimler yüklendi!`);
                };
                reader.readAsBinaryString(file);
            };

            const handleExcelExport = () => {
                const exportData = doctors.map(d => ({ "Hekim Adı Soyadı": d.name, "Klinik": d.clinic || '', "Telefon": d.phone || '', "Bölge": regions.find(r => r.id === d.regionId)?.name || 'Bilinmeyen' }));
                const ws = XLSX.utils.json_to_sheet(exportData); const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, "Hekim Portföyü");
                XLSX.writeFile(wb, `Seviye_Dental_CRM_Yedek_${new Date().toISOString().split('T')[0]}.xlsx`);
            };

            const handleLoginSubmit = (e) => {
                e.preventDefault(); const matchedUser = systemUsers.find(u => u.username === loginForm.username && u.password === loginForm.password);
                if (matchedUser) { setIsLoggedIn(true); setCurrentUser(matchedUser.name); localStorage.setItem('crm_user_session', matchedUser.name); setLoginForm({ username: '', password: '' }); } else { alert("❌ Hatalı Kullanıcı Adı veya Şifre!"); }
            };

            const handleLogoutAction = () => { setIsLoggedIn(false); setCurrentUser(''); localStorage.removeItem('crm_user_session'); };
            const handleDragStart = (id) => setDraggedRegionId(id);
            const handleDrop = async (targetId) => {
                if (!draggedRegionId || draggedRegionId === targetId) return;
                const { doc, updateDoc } = window.FirebaseMethods;
                const draggedIdx = regions.findIndex(r => r.id === draggedRegionId); const targetIdx = regions.findIndex(r => r.id === targetId);
                const updated = [...regions]; const [removed] = updated.splice(draggedIdx, 1); updated.splice(targetIdx, 0, removed);
                updated.forEach((r, idx) => { updateDoc(doc(window.db, 'shared_regions', r.id), { order: idx }); });
            };

            const toggleTodayVisit = async (docItem) => {
                const { doc, updateDoc } = window.FirebaseMethods;
                await updateDoc(doc(window.db, 'shared_doctors', docItem.id), { visitToday: !docItem.visitToday });
            };

            const handleAddDoctor = async (e) => {
                e.preventDefault(); if (!doctorForm.name || !doctorForm.regionId) return;
                const { collection, addDoc, doc, updateDoc } = window.FirebaseMethods;
                
                if (editingDoctorId) {
                    await updateDoc(doc(window.db, 'shared_doctors', editingDoctorId), { name: doctorForm.name, phone: doctorForm.phone, clinic: doctorForm.clinic, regionId: doctorForm.regionId, visitToday: !!doctorForm.visitToday });
                } else {
                    const docRef = await addDoc(collection(window.db, 'shared_doctors'), {
                        name: doctorForm.name, phone: doctorForm.phone, clinic: doctorForm.clinic, regionId: doctorForm.regionId, visitToday: !!doctorForm.visitToday, lastVisitStatus: 'none', lastVisitTime: 0, timestamp: Date.now()
                    });
                    if (doctorForm.note) {
                        await addDoc(collection(window.db, 'shared_visits'), { doctorId: docRef.id, text: doctorForm.note, rawText: doctorForm.note, date: new Date().toLocaleString('tr-TR'), timestamp: Date.now(), user: currentUser, status: 'success' });
                    }
                }
                setShowModal(false); setEditingDoctorId(null); setDoctorForm({ name: '', phone: '', clinic: '', regionId: '', note: '', visitToday: false });
            };

            const handleStartEditDoctor = (docItem) => {
                setEditingDoctorId(docItem.id); setDoctorForm({ name: docItem.name, phone: docItem.phone || '', clinic: docItem.clinic || '', regionId: docItem.regionId, visitToday: !!docItem.visitToday, note: '' });
                setModalType('doctor'); setShowModal(true);
            };

            const handleAddRegion = async (e) => {
                e.preventDefault(); if (!regionForm.name) return;
                const { collection, addDoc } = window.FirebaseMethods;
                await addDoc(collection(window.db, 'shared_regions'), { name: regionForm.name, order: regions.length });
                setShowModal(false); setRegionForm({ name: '' });
            };

            const handleAddUser = async (e) => {
                e.preventDefault(); if (!userForm.username || !userForm.password || !userForm.name) return;
                const { collection, addDoc } = window.FirebaseMethods;
                await addDoc(collection(window.db, 'shared_users'), { username: userForm.username, password: userForm.password, name: userForm.name });
                setShowModal(false); setUserForm({ username: '', password: '', name: '' });
            };

            const handleDeleteUser = async (id) => {
                if (!confirm("Bu kullanıcının sistem erişimini kaldırmak istediğinize emin misiniz?")) return;
                const { doc, deleteDoc } = window.FirebaseMethods; await deleteDoc(doc(window.db, 'shared_users', id));
            };

            const handleSaveNote = async (docId) => {
                if (!newNoteText.trim()) return;
                const { collection, addDoc, doc, updateDoc } = window.FirebaseMethods;
                let reminderInfo = ""; let emailRem = reminderEmail || null; let emailDt = null;
                if (reminderDate && reminderEmail) {
                    emailDt = new Date(reminderDate).toLocaleString('tr-TR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
                    reminderInfo = ` [M-Hatırlatıcı: ${emailDt} saatinde ${reminderEmail} adresine gönderilecek]`;
                }
                if (editingNoteId) {
                    await updateDoc(doc(window.db, 'shared_visits', editingNoteId), { text: newNoteText + reminderInfo, rawText: newNoteText, emailReminder: emailRem, emailDate: emailDt, user: currentUser, status: visitStatus });
                } else {
                    await addDoc(collection(window.db, 'shared_visits'), { doctorId: docId, text: newNoteText + reminderInfo, rawText: newNoteText, date: new Date().toLocaleString('tr-TR'), timestamp: Date.now(), emailReminder: emailRem, emailDate: emailDt, user: currentUser, status: visitStatus });
                }
                await updateDoc(doc(window.db, 'shared_doctors', docId), { lastVisitStatus: visitStatus, lastVisitTime: Date.now() });
                setNewNoteText(''); setReminderEmail(''); setEditingNoteId(null); setReminderDate(getTenDaysLaterISO()); setVisitStatus('success');
            };

            const handleStartEditNote = (note) => {
                setEditingNoteId(note.id); setNewNoteText(note.rawText || note.text.split(" [M-Hatırlatıcı:")[0]);
                setReminderEmail(note.emailReminder || ''); setVisitStatus(note.status || 'success');
                if (note.emailDate) {
                    const parts = note.emailDate.split(' '); const dateParts = parts[0].split('.');
                    setReminderDate(`${dateParts[2]}-${dateParts[1]}-${dateParts[0]}T${parts[1]}`);
                } else { setReminderDate(''); }
            };

            const handleDeleteNote = async (noteId) => {
                if (!confirm("Bu notu silmek istediğinize emin misiniz?")) return;
                const { doc, deleteDoc } = window.FirebaseMethods; await deleteDoc(doc(window.db, 'shared_visits', noteId));
            };

            const handleDeleteDoctor = async (id) => {
                if (confirm("Bu hekimi sistemden silmek istediğinize emin misiniz?")) {
                    const { doc, deleteDoc } = window.FirebaseMethods; await deleteDoc(doc(window.db, 'shared_doctors', id));
                }
            };

            const cleanTurkish = (str) => String(str).toLocaleLowerCase('tr-TR').replace(/ğ/g, 'g').replace(/ü/g, 'u').replace(/ş/g, 's').replace(/ı/g, 'i').replace(/ö/g, 'o').replace(/ç/g, 'c');

            const filteredDoctors = useMemo(() => {
                const todayStr = new Date().toLocaleDateString('tr-TR');
                const fourteenDaysAgo = Date.now() - 14 * 24 * 60 * 60 * 1000;
                return doctors.filter(doc => {
                    if (activeRegion === 'failed_visits_panel') return doc.lastVisitStatus === 'fail' && doc.lastVisitTime >= fourteenDaysAgo;
                    if (activeRegion === 'success_visits_panel') return doc.lastVisitStatus === 'success' && doc.lastVisitTime >= fourteenDaysAgo;
                    if (activeRegion === 'report_panel') return doctorVisits.some(v => v.doctorId === doc.id && v.date && v.date.split(' ')[0] === todayStr);
                    if (activeRegion === 'today_panel') {
                        const hasTodayReminder = doctorVisits.filter(v => v.doctorId === doc.id).some(v => v.emailDate && v.emailDate.split(' ')[0] === todayStr);
                        return doc.visitToday || hasTodayReminder;
                    }
                    const matchesRegion = activeRegion === 'all' || doc.regionId === activeRegion;
                    const searchTarget = cleanTurkish(doc.name) + " " + cleanTurkish(doc.clinic || '');
                    return matchesRegion && searchTarget.includes(cleanTurkish(searchTerm));
                });
            }, [doctors, activeRegion, searchTerm, doctorVisits]);

            const handleTabSelect = (tabId) => { setActiveRegion(tabId); setIsMobileMenuOpen(false); };

            if (!fbReady) return <div className="min-h-screen flex items-center justify-center bg-slate-900 text-blue-500 font-black animate-pulse">ORTAK BULUT VERİ TABANINA BAĞLANILIYOR...</div>;

            if (!isLoggedIn) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-slate-900 p-4">
                        <div className="w-full max-w-md bg-white rounded-[2.5rem] shadow-2xl p-10 animate-in">
                            <div className="text-center mb-8">
                                <div className="inline-flex bg-blue-600 p-4 rounded-2xl text-white mb-4"><Icon name="activity" size={36} /></div>
                                <h1 className="text-2xl font-black text-slate-800">Seviye Dental <span className="text-blue-600">CRM</span></h1>
                                <p className="text-slate-400 text-[10px] font-bold uppercase tracking-widest mt-1">Ortak Saha Havuzu Girişi</p>
                            </div>
                            <form onSubmit={handleLoginSubmit} className="space-y-4">
                                <input type="text" required className="w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl outline-none font-bold text-slate-700 focus:border-blue-500" placeholder="Kullanıcı Adı" value={loginForm.username} onChange={e => setLoginForm({...loginForm, username: e.target.value})} />
                                <input type="password" required className="w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl outline-none font-bold text-slate-700 focus:border-blue-500" placeholder="Şifre" value={loginForm.password} onChange={e => setLoginForm({...loginForm, password: e.target.value})} />
                                <button type="submit" className="w-full py-4 bg-blue-600 text-white font-black rounded-2xl shadow-xl hover:bg-blue-700 transition-all text-sm uppercase tracking-wider">Sisteme Giriş Yap</button>
                            </form>
                        </div>
                    </div>
                );
            }

            return (
                <div className="flex flex-col lg:flex-row min-h-screen relative">
                    {isMobileMenuOpen && <div onClick={() => setIsMobileMenuOpen(false)} className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-40 lg:hidden"></div>}

                    <aside className={`sidebar w-72 bg-slate-900 text-slate-400 p-6 flex flex-col h-screen fixed top-0 left-0 z-50 shadow-2xl transition-transform duration-300 lg:translate-x-0 ${isMobileMenuOpen ? 'translate-x-0' : '-translate-x-full lg:fixed'}`}>
                        <div className="flex items-center justify-between mb-6 px-2">
                            <div className="flex items-center gap-3">
                                <div className="bg-blue-600 p-2.5 rounded-2xl text-white"><Icon name="activity" size={24} /></div>
                                <div><h1 className="text-xl font-extrabold text-white">Seviye<span className="text-blue-500">CRM</span></h1><p className="text-[10px] text-slate-400 font-bold uppercase tracking-widest">Saha Takip Havuzu</p></div>
                            </div>
                            <button onClick={() => setIsMobileMenuOpen(false)} className="lg:hidden p-2 text-slate-400 border border-slate-700 rounded-xl"><Icon name="x" size={16} /></button>
                        </div>

                        <div className="space-y-1 overflow-y-auto flex-1 pr-1 custom-scrollbar">
                            <button onClick={() => handleTabSelect('today_panel')} className={`w-full flex items-center justify-between px-4 py-3 rounded-xl font-bold text-sm ${activeRegion === 'today_panel' ? 'bg-amber-500 text-white shadow-lg' : 'bg-slate-800/40 text-amber-400 hover:bg-slate-800'}`}>
                                <span className="flex items-center gap-3"><Icon name="calendar-check" size={18} /> Bugün Gezilecekler</span>
                            </button>
                            <button onClick={() => handleTabSelect('report_panel')} className={`w-full flex items-center justify-between px-4 py-3 rounded-xl font-bold text-sm ${activeRegion === 'report_panel' ? 'bg-emerald-600 text-white shadow-lg' : 'bg-slate-800/40 text-emerald-400 hover:bg-slate-800'}`}>
                                <span className="flex items-center gap-3"><Icon name="file-text" size={18} /> Akşam Saha Raporu</span>
                            </button>

                            <div className="pt-2 pb-1 px-2"><h2 className="text-[10px] font-black uppercase text-slate-500 tracking-wider">2 Haftalık Durum Takibi</h2></div>
                            <button onClick={() => handleTabSelect('failed_visits_panel')} className={`w-full flex items-center justify-between px-4 py-2.5 rounded-xl font-bold text-xs ${activeRegion === 'failed_visits_panel' ? 'bg-red-600 text-white' : 'bg-slate-800/40 text-red-400 hover:bg-slate-800'}`}>
                                <span className="flex items-center gap-3"><Icon name="phone-off" size={14} /> 🔴 Tekrar Uğranacaklar</span>
                            </button>
                            <button onClick={() => handleTabSelect('success_visits_panel')} className={`w-full flex items-center justify-between px-4 py-2.5 rounded-xl font-bold text-xs mb-4 ${activeRegion === 'success_visits_panel' ? 'bg-indigo-600 text-white' : 'bg-slate-800/40 text-indigo-400 hover:bg-slate-800'}`}>
                                <span className="flex items-center gap-3"><Icon name="check-circle" size={14} /> 🟢 Nadasa Bırakılanlar</span>
                            </button>

                            <div className="flex items-center justify-between mb-2 px-2 border-t border-slate-800 pt-3">
                                <h2 className="text-xs font-black uppercase text-slate-400 tracking-wider">Bölgeler / Rotalar</h2>
                                <button onClick={() => { setModalType('region'); setEditingDoctorId(null); setShowModal(true); }} className="p-1 hover:bg-slate-800 rounded-lg text-blue-400"><Icon name="plus" size={18} /></button>
                            </div>

                            <button onClick={() => handleTabSelect('all')} className={`w-full flex items-center justify-between px-4 py-3 rounded-xl font-bold text-sm ${activeRegion === 'all' ? 'bg-blue-600 text-white' : 'text-slate-400 hover:bg-slate-800'}`}>
                                <span className="flex items-center gap-3"><Icon name="globe" size={18} /> Tüm Hekimler</span>
                                <span className="text-xs bg-slate-800 text-slate-300 px-2 py-0.5 rounded-md">{doctors.length}</span>
                            </button>

                            {regions.map(reg => (
                                <div key={reg.id} draggable onDragStart={() => handleDragStart(reg.id)} onDragOver={e => e.preventDefault()} onDrop={() => handleDrop(reg.id)} onClick={() => handleTabSelect(reg.id)} className={`w-full flex items-center justify-between px-4 py-3 rounded-xl font-bold text-sm transition-all cursor-grab active:cursor-grabbing ${activeRegion === reg.id ? 'bg-blue-600 text-white' : 'text-slate-400 hover:bg-slate-800'}`}><span className="flex items-center gap-3 truncate"><Icon name="grip-vertical" size={16} className="text-slate-600" /><span className="truncate">{reg.name}</span></span><span className="text-xs bg-slate-800 text-slate-300 px-2 py-0.5 rounded-md">{doctors.filter(d => d.regionId === reg.id).length}</span></div>
                            ))}

                            <div className="mt-4 pt-4 border-t border-slate-800 space-y-1">
                                <button onClick={() => handleTabSelect('users_panel')} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl font-bold text-sm ${activeRegion === 'users_panel' ? 'bg-blue-600 text-white' : 'text-slate-400 hover:bg-slate-800'}`}><Icon name="settings" size={18} /> Ekip & Şifre Yönetimi</button>
                                
                                {/* 🗺️ YENİ: NAVİGASYONDAN KOPYALA-YAPIŞTIR SİHİRBAZINI TETİKLEYEN HIZLI MENÜ BUTONU */}
                                <button onClick={() => { setModalType('bulk_nav'); setShowModal(true); }} className="w-full flex items-center gap-3 px-4 py-2.5 bg-blue-950/40 text-blue-400 font-bold text-xs rounded-xl hover:bg-slate-800">
                                    <Icon name="map" size={16} /> 🗺️ Haritadan Toplu Aktar
                                </button>

                                <button onClick={handleExcelExport} className="w-full flex items-center gap-3 px-4 py-2.5 rounded-xl font-bold text-xs text-emerald-400 hover:bg-slate-800/50"><Icon name="file-spreadsheet" size={16} /> Excel Portföy İndir</button>
                                <button onClick={() => fileInputRef.current.click()} className="w-full flex items-center gap-3 px-4 py-2.5 rounded-xl font-bold text-xs text-blue-400 hover:bg-slate-800/50"><Icon name="upload" size={16} /> Excel'den Toplu Yükle</button>
                                <input type="file" ref={fileInputRef} onChange={handleExcelImport} accept=".xlsx, .xls" className="hidden" />
                            </div>
                        </div>

                        <div className="mt-auto pt-4 flex items-center justify-between bg-slate-800/40 p-3 rounded-2xl">
                            <div className="truncate"><p className="text-xs font-black text-white truncate">{currentUser}</p><p className="text-[8px] text-emerald-400 font-bold uppercase tracking-wider">Oturum Açık</p></div>
                            <button onClick={handleLogoutAction} className="p-2 text-red-400 hover:bg-red-400/10 rounded-xl"><Icon name="log-out" size={18} /></button>
                        </div>
                    </aside>

                    <div className="mobile-bottom-nav-container lg:hidden fixed bottom-0 left-0 right-0 bg-white border-top z-40 flex items-center shadow-lg">
                        <div className="mobile-bottom-nav flex-1 flex justify-around p-2">
                            <button onClick={() => setIsMobileMenuOpen(true)} className="flex flex-col items-center gap-1 p-2 text-slate-700 font-bold"><Icon name="menu" size={20} /><span className="text-[9px]">Menü</span></button>
                            <button onClick={() => setActiveRegion('all')} className={`flex flex-col items-center gap-1 p-2 text-slate-400 ${activeRegion==='all'?'text-blue-500 font-bold':''}`}><Icon name="globe" size={18}/> <span className="text-[9px]">Tümü</span></button>
                            <button onClick={() => setActiveRegion('today_panel')} className={`flex flex-col items-center gap-1 p-2 text-slate-400 ${activeRegion==='today_panel'?'text-amber-500 font-bold':''}`}><Icon name="calendar-check" size={18}/> <span className="text-[9px]">Bugün</span></button>
                            <button onClick={() => setActiveRegion('report_panel')} className={`flex flex-col items-center gap-1 p-2 text-slate-400 ${activeRegion==='report_panel'?'text-emerald-500 font-bold':''}`}><Icon name="file-text" size={18}/> <span className="text-[9px]">Rapor</span></button>
                        </div>
                    </div>

                    <main className="main-content flex-1 lg:ml-72 p-4 lg:p-10 bg-slate-50 min-h-screen pb-24 lg:pb-10">
                        {activeRegion === 'users_panel' ? (
                            <div className="space-y-6 animate-in">
                                <header className="flex justify-between items-center mb-6">
                                    <div><h2 className="text-2xl font-extrabold text-slate-800">Saha Ekibi & Şifre Yönetimi</h2><p className="text-xs font-bold text-slate-400 uppercase tracking-widest mt-1">Yeni Temsilci Hesabı Oluşturma</p></div>
                                    <button onClick={() => { setModalType('user'); setShowModal(true); }} className="px-5 py-3 bg-blue-600 text-white font-bold text-xs uppercase tracking-widest rounded-xl shadow-lg hover:bg-blue-700">+ Yeni Temsilci Ekle</button>
                                </header>
                                <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6">
                                    {systemUsers.map(u => (
                                        <div key={u.id} className="bg-white p-6 rounded-3xl border shadow-sm flex flex-col justify-between">
                                            <div>
                                                <div className="bg-blue-50 text-blue-600 p-3 rounded-2xl inline-flex mb-4"><Icon name="user" size={24} /></div>
                                                <h4 className="text-lg font-black text-slate-800">{u.name}</h4>
                                                <p className="text-xs text-slate-400 font-bold mt-1">Kullanıcı: <span className="text-slate-700">{u.username}</span></p>
                                                <p className="text-xs text-slate-400 font-bold">Şifre: <span className="text-slate-700">{u.password}</span></p>
                                            </div>
                                            {u.username !== 'admin' && <button onClick={() => handleDeleteUser(u.id)} className="w-full mt-4 py-2 bg-red-50 text-red-500 text-xs font-bold rounded-xl">Hesabı Kaldır</button>}
                                        </div>
                                    ))}
                                </div>
                            </div>
                        ) : activeRegion === 'report_panel' ? (
                            <div className="space-y-6 animate-in">
                                <header className="mb-6"><h2 className="text-2xl font-extrabold text-slate-800">📋 Bugünün Saha Ziyaret Raporu</h2><p className="text-xs font-bold text-emerald-600 uppercase tracking-widest mt-1">Bugün Not Girilen Hekimler Listesi</p></header>
                                <div className="bg-white rounded-[2rem] border p-6 shadow-sm overflow-hidden">
                                    <div className="overflow-x-auto">
                                        <table className="w-full text-left border-collapse border-0">
                                            <thead>
                                                <tr className="border-b text-[10px] font-black uppercase text-slate-400 tracking-wider"><th className="py-4 px-4">Hekim Adı</th><th className="py-4 px-4">Klinik / Hastane</th><th className="py-4 px-4">Bölge</th><th className="py-4 px-4">Bugün Girilen Ziyaret Notu</th></tr>
                                            </thead>
                                            <tbody className="divide-y text-xs font-bold text-slate-700">
                                                {filteredDoctors.map(doc => {
                                                    const todayStr = new Date().toLocaleDateString('tr-TR');
                                                    const todayVisits = doctorVisits.filter(v => v.doctorId === doc.id && v.date && v.date.split(' ')[0] === todayStr);
                                                    return todayVisits.map((v, index) => (
                                                        <tr key={v.id} className="hover:bg-slate-50/80 transition-colors">
                                                            {index === 0 ? (
                                                                <>
                                                                    <td className="py-4 px-4 font-extrabold text-slate-900 text-sm" rowSpan={todayVisits.length}>{doc.name}</td>
                                                                    <td className="py-4 px-4 text-slate-500" rowSpan={todayVisits.length}>{doc.clinic || '-'}</td>
                                                                    <td className="py-4 px-4" rowSpan={todayVisits.length}><span className="bg-slate-100 text-slate-600 px-2 py-0.5 rounded font-black">{regions.find(r => r.id === doc.regionId)?.name}</span></td>
                                                                </>
                                                            ) : null}
                                                            <td className="py-4 px-4 border-l bg-emerald-50/30"><p className="text-slate-800">"{v.rawText || v.text}"</p><div className="flex gap-2 mt-1 text-[9px] font-black"><span className="text-slate-400">⏱️ {v.date.split(' ')[1]}</span><span className="text-blue-600">👤 Yazan: {v.user || 'Sistem'}</span></div></td>
                                                        </tr>
                                                    ));
                                                })}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        ) : (
                            <>
                                <div className="flex justify-between items-center mb-6">
                                    <div>
                                        <h2 className="text-2xl font-extrabold text-slate-800">
                                            {activeRegion === 'all' ? 'Tüm Portföy' : activeRegion === 'today_panel' ? '📅 Bugün Ziyaret Edilecek Hekimler' : activeRegion === 'failed_visits_panel' ? '🔴 Son 2 Hafta Görüşülemeyen Temsilcilikler' : activeRegion === 'success_visits_panel' ? '🟢 Son 2 Hafta Başarılı Görüşülen Temsilcilikler' : regions.find(r => r.id === activeRegion)?.name}
                                        </h2>
                                        <p className="text-xs font-bold text-slate-400 uppercase tracking-widest mt-1">Saha İletişim Havuzu</p>
                                    </div>
                                    <button onClick={() => { setModalType('doctor'); setEditingDoctorId(null); setDoctorForm({ name: '', phone: '', clinic: '', regionId: ['all', 'today_panel', 'failed_visits_panel', 'success_visits_panel'].includes(activeRegion) ? '' : activeRegion, note: '', visitToday: false }); setShowModal(true); }} className="px-4 py-2.5 bg-blue-600 text-white font-bold text-xs uppercase tracking-widest rounded-xl shadow-lg hover:bg-blue-700">+ Ekle</button>
                                </div>

                                <div className="mb-6 relative">
                                    <input type="text" placeholder="Hekim adı veya klinik aratın..." className="w-full pl-12 pr-4 py-4 bg-white border border-slate-200 rounded-2xl outline-none focus:ring-2 focus:ring-blue-500 font-medium text-sm shadow-sm" value={searchTerm} onChange={e => setSearchTerm(e.target.value)}/>
                                    <div className="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"><Icon name="search" size={20} /></div>
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6">
                                    {filteredDoctors.map(doc => {
                                        const lastVisit = doctorVisits.find(v => v.doctorId === doc.id);
                                        return (
                                            <div key={doc.id} className={`bg-white rounded-3xl border-l-8 border-y border-r border-slate-100 shadow-sm p-6 flex flex-col justify-between hover:shadow-xl transition-all ${doc.lastVisitStatus === 'success' ? 'border-l-green-500' : doc.lastVisitStatus === 'fail' ? 'border-l-red-500' : 'border-l-slate-300'}`}>
                                                <div>
                                                    <div className="flex justify-between items-start mb-4">
                                                        <div className="bg-blue-50 text-blue-600 p-3 rounded-2xl"><Icon name="user-round" size={24} /></div>
                                                        <button onClick={(e) => { e.stopPropagation(); toggleTodayVisit(doc); }} className={`text-[10px] font-black uppercase tracking-wider px-2.5 py-1 rounded-md transition-all ${doc.visitToday ? 'bg-amber-500 text-white' : 'bg-slate-100 text-slate-600 hover:bg-amber-100'}`}>{doc.visitToday ? '🌟 Listemde' : '➕ Ekle'}</button>
                                                    </div>
                                                    <h3 className="text-lg font-extrabold text-slate-800 mb-1">{doc.name}</h3>
                                                    {doc.clinic && <p className="text-xs font-bold text-slate-400 flex items-center gap-1.5 mb-1"><Icon name="building" size={14} /> {doc.clinic}</p>}
                                                    {doc.phone && <p className="text-xs font-bold text-slate-400 flex items-center gap-1.5 mb-2"><Icon name="phone" size={14} /> {doc.phone}</p>}
                                                    
                                                    <div className="mt-1">
                                                        {doc.lastVisitStatus === 'success' && <span className="text-[9px] font-black uppercase bg-green-50 text-green-700 px-2 py-0.5 rounded">🟢 Başarılı Görüşme</span>}
                                                        {doc.lastVisitStatus === 'fail' && <span className="text-[9px] font-black uppercase bg-red-50 text-red-700 px-2 py-0.5 rounded">🔴 Görüşme Sağlanamadı</span>}
                                                    </div>

                                                    <div className="bg-slate-50 rounded-xl p-3 border mt-3 text-xs">
                                                        <p className="text-[9px] font-black text-slate-400 uppercase mb-1">📍 Son Saha Notu</p>
                                                        {lastVisit ? (
                                                            <div>
                                                                <p className="font-bold text-slate-700">"{lastVisit.rawText || lastVisit.text}"</p>
                                                                <span className="text-[8px] mt-1 inline-block bg-slate-200 text-slate-600 px-1.5 py-0.5 rounded font-bold">✍️ Sorumlu: {lastVisit.user || 'Ekip Üyesi'}</span>
                                                            </div>
                                                        ) : <p className="text-slate-400 italic">Not alınmamış.</p>}
                                                    </div>
                                                </div>
                                                <div className="flex gap-2 mt-4">
                                                    <button onClick={() => { setSelectedDoctor(doc); setEditingNoteId(null); setNewNoteText(''); setVisitStatus(doc.lastVisitStatus || 'success'); }} className="flex-1 py-2.5 bg-slate-900 text-white font-bold text-xs uppercase rounded-xl hover:bg-slate-800">Detay & Notlar</button>
                                                    <button onClick={() => handleStartEditDoctor(doc)} className="p-2.5 bg-blue-50 text-blue-600 rounded-xl hover:bg-blue-100" title="Hekim Bilgilerini Düzenle"><Icon name="pencil" size={16}/></button>
                                                    <button onClick={() => handleDeleteDoctor(doc.id)} className="p-2.5 bg-red-50 text-red-500 rounded-xl hover:bg-red-100"><Icon name="trash-2" size={16}/></button>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </>
                        )}
                    </main>

                    {selectedDoctor && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-md z-[150] flex items-center justify-center p-4">
                            <div className="bg-white rounded-[2.5rem] shadow-2xl w-full max-w-xl overflow-hidden p-6 sm:p-8 animate-in">
                                <div className="flex justify-between items-center mb-4">
                                    <h3 className="text-xl font-extrabold text-slate-900">{selectedDoctor.name} Günlüğü</h3>
                                    <button onClick={() => { setSelectedDoctor(null); setEditingNoteId(null); setNewNoteText(''); }} className="p-2 border rounded-xl hover:bg-slate-100"><Icon name="x" size={18} /></button>
                                </div>
                                <div className="space-y-4 max-h-[70vh] overflow-y-auto pr-1 custom-scrollbar">
                                    <div className="space-y-3 bg-slate-50 p-4 rounded-2xl border border-blue-100">
                                        <textarea placeholder="Ziyaret notunu buraya girin..." className="w-full p-3 border rounded-xl text-xs font-bold h-16 outline-none bg-white focus:border-blue-500" value={newNoteText} onChange={e => setNewNoteText(e.target.value)} />
                                        <div>
                                            <label className="block text-[9px] font-black text-slate-400 uppercase tracking-wider mb-2 ml-1">Bu Ziyaretin Durumu Nedir?</label>
                                            <div className="grid grid-cols-2 gap-2">
                                                <button type="button" onClick={() => setVisitStatus('success')} className={`py-2 px-3 rounded-xl text-xs font-black uppercase tracking-wider border transition-all flex items-center justify-center gap-1.5 ${visitStatus === 'success' ? 'bg-green-600 text-white border-green-600' : 'bg-white text-slate-600 hover:bg-slate-100'}`}><Icon name="check-circle" size={14} /> Görüşme Sağlandı</button>
                                                <button type="button" onClick={() => setVisitStatus('fail')} className={`py-2 px-3 rounded-xl text-xs font-black uppercase tracking-wider border transition-all flex items-center justify-center gap-1.5 ${visitStatus === 'fail' ? 'bg-red-600 text-white border-red-600' : 'bg-white text-slate-600 hover:bg-slate-100'}`}><Icon name="phone-off" size={14} /> Görüşme Sağlanamadı</button>
                                            </div>
                                        </div>
                                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-2 pt-1">
                                            <div><input type="datetime-local" className="w-full p-2 bg-white border rounded-lg text-xs font-bold outline-none text-slate-600" value={reminderDate} onChange={e => setReminderDate(e.target.value)} /></div>
                                            <div><input type="email" placeholder="Hatırlatılacak E-Posta" className="w-full p-2 bg-white border rounded-lg text-xs font-bold outline-none text-slate-600" value={reminderEmail} onChange={e => setReminderEmail(e.target.value)} /></div>
                                        </div>
                                        <button type="button" onClick={async () => { await handleSaveNote(selectedDoctor.id); }} className="w-full py-2.5 bg-blue-600 text-white font-black text-xs uppercase rounded-xl shadow-md">Notu ve Durumu Ortak Havuza Kaydet</button>
                                    </div>
                                    <div className="space-y-2 pt-4 border-t">
                                        {doctorVisits.filter(v => v.doctorId === selectedDoctor.id).map(n => (
                                            <div key={n.id} className="bg-slate-50 p-4 rounded-2xl border relative group/note"><div className="absolute right-3 top-3 flex gap-2"><button onClick={() => handleStartEditNote(n)} className="text-slate-300 hover:text-blue-500"><Icon name="pencil" size={14} /></button><button onClick={() => handleDeleteNote(n.id)} className="text-slate-300 hover:text-red-500 transition-colors"><Icon name="trash-2" size={14} /></button></div><span className="text-[9px] font-black text-blue-500 block">{n.date} {n.status === 'fail' ? '❌ (Görüşülemedi)' : '✅ (Görüşüldü)'}</span><p className="text-xs font-bold text-slate-700 mt-1.5 pr-12 leading-relaxed">"{n.rawText || n.text}"</p></div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {showModal && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-md z-[150] flex items-center justify-center p-4">
                            <div className="bg-white rounded-[2.5rem] shadow-2xl w-full max-w-md overflow-hidden p-8 animate-in">
                                <div className="flex justify-between items-center mb-6">
                                    <h3 className="text-lg font-extrabold text-slate-900 uppercase">
                                        {modalType === 'doctor' ? (editingDoctorId ? 'Hekim Bilgilerini Düzenle' : 'Yeni Hekim Ekle') : modalType === 'region' ? 'Yeni Rota Ekle' : modalType === 'bulk_nav' ? '🗺️ Haritadan Kopyala-Yapıştır Sihirbazı' : 'Yeni Temsilci Ekle'}
                                    </h3>
                                    <button onClick={() => { setShowModal(false); setEditingDoctorId(null); }} className="p-2 border rounded-xl"><Icon name="x" size={16} /></button>
                                </div>
                                {modalType === 'region' && (
                                    <form onSubmit={handleAddRegion} className="space-y-4">
                                        <input type="text" required placeholder="Rota Adı" className="w-full p-4 border rounded-xl font-bold text-sm outline-none" value={regionForm.name} onChange={e => setRegionForm({name: e.target.value})} />
                                        <button type="submit" className="w-full py-4 bg-blue-600 text-white font-black text-xs uppercase rounded-xl">Rotayı Kaydet</button>
                                    </form>
                                )}
                                
                                {/* 🗺️ YENİ: HARİTADAN KOPYALA YAPIŞTIR SİHİRBAZININ TASARIMI */}
                                {modalType === 'bulk_nav' && (
                                    <form onSubmit={handleBulkNavParse} className="space-y-4">
                                        <p className="text-[11px] font-bold text-slate-500 leading-relaxed bg-blue-50 text-blue-800 p-3 rounded-xl border border-blue-100">
                                            💡 <b>Kullanım:</b> Google Haritalar'dan kopyaladığın darmadağınık klinik verilerini (isim, adres, tel karışık halde) aşağıdaki alana olduğu gibi yapıştır. Sistem otomatik ayıklayacaktır.
                                        </p>
                                        <textarea required placeholder="Harita verilerini buraya yapıştırın..." className="w-full p-4 border rounded-2xl font-bold text-xs h-48 outline-none resize-none bg-slate-50 text-slate-700" value={bulkNavText} onChange={e => setBulkNavText(e.target.value)} />
                                        <button type="submit" className="w-full py-4 bg-blue-600 text-white font-black text-xs uppercase rounded-xl shadow-md">Metni Çözümle ve Hekimleri Ekle</button>
                                    </form>
                                )}

                                {modalType === 'doctor' && (
                                    <form onSubmit={handleAddDoctor} className="space-y-4">
                                        <input type="text" required placeholder="Hekim Adı Soyadı" className="w-full p-4 border rounded-xl font-bold text-sm outline-none" value={doctorForm.name} onChange={e => setDoctorForm({...doctorForm, name: e.target.value})} />
                                        <input type="text" placeholder="Klinik / Hastane" className="w-full p-4 border rounded-xl font-bold text-sm outline-none" value={doctorForm.clinic} onChange={e => setDoctorForm({...doctorForm, clinic: e.target.value})} />
                                        <input type="text" placeholder="Telefon Numarası" className="w-full p-4 border rounded-xl font-bold text-sm outline-none" value={doctorForm.phone} onChange={e => setDoctorForm({...doctorForm, phone: e.target.value})} />
                                        <select required className="w-full p-4 border rounded-xl font-bold text-sm text-slate-600 outline-none bg-slate-50" value={doctorForm.regionId} onChange={e => setDoctorForm({...doctorForm, regionId: e.target.value})}><option value="">Bölge / Rota Seçin...</option>{regions.map(r => <option key={r.id} value={r.id}>{r.name}</option>)}</select>
                                        {!editingDoctorId && (
                                            <div className="flex items-center gap-2 p-2 bg-slate-50 rounded-xl border">
                                                <input type="checkbox" id="visitTodayCheck" className="w-4 h-4 text-blue-600" checked={doctorForm.visitToday} onChange={e => setDoctorForm({...doctorForm, visitToday: e.target.checked})} />
                                                <label htmlFor="visitTodayCheck" className="text-xs font-bold text-slate-700 cursor-pointer select-none">Bu hekimi doğrudan "Bugün Gezilecekler" listeme ekle</label>
                                            </div>
                                        )}
                                        {!editingDoctorId && <textarea placeholder="İlk ziyaret notu..." className="w-full p-4 border rounded-xl font-bold text-xs h-16 outline-none resize-none bg-slate-50" value={doctorForm.note} onChange={e => setDoctorForm({...doctorForm, note: e.target.value})} />}
                                        <button type="submit" className="w-full py-4 bg-blue-600 text-white font-black text-xs uppercase rounded-xl">{editingDoctorId ? 'Değişiklikleri Kaydet' : 'Hekimi Ekle'}</button>
                                    </form>
                                )}
                                {modalType === 'user' && (
                                    <form onSubmit={handleAddUser} className="space-y-4">
                                        <input type="text" required placeholder="Temsilci Adı Soyadı" className="w-full p-4 border rounded-xl font-bold text-sm outline-none" value={userForm.name} onChange={e => setUserForm({...userForm, name: e.target.value})} />
                                        <input type="text" required placeholder="Giriş Kullanıcı Adı" className="w-full p-4 border rounded-xl font-bold text-sm outline-none" value={userForm.username} onChange={e => setUserForm({...userForm, username: e.target.value})} />
                                        <input type="text" required placeholder="Giriş Şifresi" className="w-full p-4 border rounded-xl font-bold text-sm outline-none" value={userForm.password} onChange={e => setUserForm({...userForm, password: e.target.value})} />
                                        <button type="submit" className="w-full py-4 bg-blue-600 text-white font-black text-xs uppercase rounded-xl">Temsilci Hesabı Oluştur</button>
                                    </form>
                                )}
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
