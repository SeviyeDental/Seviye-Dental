<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seviye Dental - Master CRM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, doc, collection, query, onSnapshot, addDoc, updateDoc, deleteDoc, orderBy, where, getDocs, writeBatch } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        const app = initializeApp({ apiKey: "AIzaSyCJJP857pMmLoCc7CMzswHNwTp_TAybMdE", authDomain: "webapp-d239c.firebaseapp.com", projectId: "webapp-d239c", storageBucket: "webapp-d239c.firebasestorage.app", messagingSenderId: "965046349663", appId: "1:965046349663:web:dbdda634472521accad0ea" });
        window.db = getFirestore(app); window.auth = getAuth(app);
        window.FirebaseMethods = { doc, collection, query, onSnapshot, addDoc, updateDoc, deleteDoc, orderBy, where, getDocs, writeBatch, signInWithEmailAndPassword, signOut, onAuthStateChanged };
    </script>
</head>
<body class="bg-slate-50 antialiased"><div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useMemo } = React;
const Icon = ({ name, size = 20 }) => { useEffect(() => window.lucide.createIcons(), []); return <i data-lucide={name} style={{width: size, height: size}}></i>; };const App = () => {
    const [isLoggedIn, setIsLoggedIn] = useState(false);
    const [doctors, setDoctors] = useState([]);
    const [visits, setVisits] = useState([]);
    const [logs, setLogs] = useState([]);
    const [activeRegion, setActiveRegion] = useState('all');
    const [reportDate, setReportDate] = useState(new Date().toISOString().split('T')[0]);
    const [isAdmin, setIsAdmin] = useState(false);

    useEffect(() => {
        const { collection, onSnapshot, query, orderBy, onAuthStateChanged, getDocs, where } = window.FirebaseMethods;
        onAuthStateChanged(window.auth, async (u) => {
            if (u) {
                setIsLoggedIn(true);
                const q = query(collection(window.db, 'shared_users'), where('email', '==', u.email));
                const s = await getDocs(q);
                setIsAdmin(!s.empty && s.docs[0].data().role === 'admin');
            } else setIsLoggedIn(false);
        });
        onSnapshot(collection(window.db, 'shared_doctors'), (s) => setDoctors(s.docs.map(d => ({ ...d.data(), id: d.id }))));
        onSnapshot(query(collection(window.db, 'shared_visits'), orderBy('timestamp', 'desc')), (s) => setVisits(s.docs.map(d => ({ ...d.data(), id: d.id }))));
        onSnapshot(query(collection(window.db, 'shared_logs'), orderBy('timestamp', 'desc')), (s) => setLogs(s.docs.map(d => ({ ...d.data(), id: d.id }))));
    }, []);

    const logAction = async (details, type, targetIds) => {
        await window.FirebaseMethods.addDoc(window.FirebaseMethods.collection(window.db, 'shared_logs'), {
            user: window.auth.currentUser.email, details, type, targetIds, timestamp: Date.now(), date: new Date().toLocaleString()
        });
    };

    const undoAction = async (log) => {
        if(!confirm("Geri alınsın mı?")) return;
        const { doc, deleteDoc } = window.FirebaseMethods;
        for(let id of log.targetIds) { await deleteDoc(doc(window.db, 'shared_doctors', id)); }
        await deleteDoc(doc(window.db, 'shared_logs', log.id));
    };if (!isLoggedIn) return <div className="min-h-screen flex items-center justify-center"><form onSubmit={(e)=>{e.preventDefault(); window.FirebaseMethods.signInWithEmailAndPassword(window.auth, e.target[0].value, e.target[1].value)}} className="bg-white p-8 rounded-2xl shadow-xl w-80 space-y-4"><input type="email" placeholder="E-Posta" className="w-full p-3 border rounded-xl"/><input type="password" placeholder="Şifre" className="w-full p-3 border rounded-xl"/><button className="w-full p-3 bg-blue-600 text-white font-bold rounded-xl">Giriş</button></form></div>;

    return (
        <div className="flex h-screen">
            <aside className="w-64 bg-slate-900 text-white p-6 flex flex-col justify-between">
                <div className="space-y-6">
                    <h1 className="text-xl font-black">Seviye CRM</h1>
                    <button onClick={()=>setActiveRegion('all')} className="block text-slate-400">Tüm Hekimler</button>
                    {isAdmin && <button onClick={()=>setActiveRegion('logs_panel')} className="block text-red-400 font-bold">🛡️ Loglar & Undo</button>}
                </div>
                <button onClick={()=>window.FirebaseMethods.signOut(window.auth)} className="text-red-500 font-bold">Çıkış</button>
            </aside>
            <main className="flex-1 p-8 overflow-y-auto">
                {activeRegion === 'logs_panel' ? (
                    <div className="space-y-4">
                        {logs.map(log => (
                            <div key={log.id} className="bg-white p-4 rounded-xl border flex justify-between">
                                <div><p className="font-bold text-sm">{log.details}</p><p className="text-[10px] text-slate-400">{log.date}</p></div>
                                <button onClick={()=>undoAction(log)} className="bg-red-100 text-red-600 px-3 py-1 rounded-lg text-xs font-bold">Geri Al</button>
                            </div>
                        ))}
                    </div>
                ) : activeRegion === 'report_panel' ? (
                    <div className="space-y-4">
                        <input type="date" value={reportDate} onChange={(e)=>setReportDate(e.target.value)} className="p-2 border rounded-xl"/>
                        {visits.filter(v => v.date.includes(reportDate)).map(v => (
                            <div key={v.id} className="bg-white p-4 rounded-xl border">{v.text}</div>
                        ))}
                    </div>
                ) : (
                    <div className="text-2xl font-black">Hekim Listesi</div>
                )}
            </main>
        </div>
    );
};
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script></body></html>
