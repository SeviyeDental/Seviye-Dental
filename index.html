<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seviye Dental - Ortak Saha Satış & CRM Sistemi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, doc, collection, query, onSnapshot, addDoc, updateDoc, deleteDoc, orderBy } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        
        const firebaseConfig = {
            apiKey: "AIzaSyCJJP857pMmLoCc7CMzswHNwTp_TAybMdE",
            authDomain: "webapp-d239c.firebaseapp.com",
            projectId: "webapp-d239c",
            storageBucket: "webapp-d239c.firebasestorage.app",
            messagingSenderId: "965046349663",
            appId: "1:965046349663:web:dbdda634472521accad0ea"
        };

        const app = initializeApp(firebaseConfig);
        window.db = getFirestore(app);
        window.FirebaseMethods = { doc, collection, query, onSnapshot, addDoc, updateDoc, deleteDoc, orderBy };
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #F8FAFC; color: #0F172A; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 20px; }
    </style>
</head>
<body class="bg-slate-50 antialiased">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        const Icon = ({ name, size = 20, className = "" }) => {
            const iconRef = useRef(null);
            useEffect(() => {
                if (iconRef.current && window.lucide) {
                    iconRef.current.innerHTML = "";
                    const iconElement = document.createElement('i');
                    iconElement.setAttribute('data-lucide', name);
                    iconElement.style.width = `${size}px`;
                    iconElement.style.height = `${size}px`;
                    if (className) iconElement.className = className;
                    iconRef.current.appendChild(iconElement);
                    window.lucide.createIcons();
                }
            }, [name, size, className]);
            return <span ref={iconRef} className="inline-flex items-center justify-center"></span>;
        };

        const App = () => {
            // Kullanıcı Giriş Durumları
            const [isLoggedIn, setIsLoggedIn] = useState(() => !!localStorage.getItem('crm_user_session'));
            const [currentUser, setCurrentUser] = useState(() => localStorage.getItem('crm_user_session') || '');
            const [loginForm, setLoginForm] = useState({ username: '', password: '' });
            const [systemUsers, setSystemUsers] = useState([]);

            const [regions, setRegions] = useState([]);
            const [doctors, setDoctors] = useState([]);
            const [doctorVisits, setDoctorVisits] = useState([]);
            const [fbReady, setFbReady] = useState(false);

            const [activeRegion, setActiveRegion] = useState('all');
            const [searchTerm, setSearchTerm] = useState('');
            const [showModal, setShowModal] = useState(false);
            const [modalType, setModalType] = useState(''); 
            const [selectedDoctor, setSelectedDoctor] = useState(null);
            const [draggedRegionId, setDraggedRegionId] = useState(null);

            const [doctorForm, setDoctorForm] = useState({ name: '', phone: '', clinic: '', regionId: '', note: '' });
            const [regionForm, setRegionForm] = useState({ name: '' });
            const [newNoteText, setNewNoteText] = useState('');
            
            const [editingNoteId, setEditingNoteId] = useState(null);
            const [reminderDate, setReminderDate] = useState(''); 
            const [reminderEmail, setReminderEmail] = useState('');
            const [uiMessage, setUiMessage] = useState(null);

            const showMessage = (text, type = "success") => { setUiMessage({ text, type }); setTimeout(() => setUiMessage(null), 3000); };

            const getTenDaysLaterISO = () => {
                const now = new Date();
                const tenDaysLater = new Date(now.getTime() + 10 * 24 * 60 * 60 * 1000);
                const tzoffset = tenDaysLater.getTimezoneOffset() * 60000;
                return new Date(tenDaysLater.getTime() - tzoffset).toISOString().slice(0, 16);
            };

            // ⏰ 2 Dakikalık Hareketsizlik Zamanlayıcısı (Auto-Logout)
            useEffect(() => {
                if (!isLoggedIn) return;

                let timeoutId;
                const idleTime = 2 * 60 * 1000; // 2 Dakika (Milisaniye cinsinden)

                const resetTimer = () => {
                    clearTimeout(timeoutId);
                    timeoutId = setTimeout(handleLogout, idleTime);
                };

                const handleLogout = () => {
                    setIsLoggedIn(false);
                    setCurrentUser('');
                    localStorage.removeItem('crm_user_session');
                    alert("🚨 2 dakika boyunca işlem yapmadığınız için oturumunuz güvenlik nedeniyle kapatılmıştır.");
                };

                // Kullanıcının yaptığı hareketleri dinle
                const events = ['mousemove', 'mousedown', 'click', 'scroll', 'keypress', 'touchstart'];
                events.forEach(event => window.addEventListener(event, resetTimer));

                resetTimer(); // Zamanlayıcıyı ilk girişte başlat

                return () => {
                    clearTimeout(timeoutId);
                    events.forEach(event => window.removeEventListener(event, resetTimer));
                };
            }, [isLoggedIn]);

            // Firebase Canlı Senkronizasyon Altyapısı
            useEffect(() => {
                const checkInterval = setInterval(() => {
                    if (window.db && window.FirebaseMethods) {
                        clearInterval(checkInterval);
                        const { collection, query, onSnapshot, orderBy } = window.FirebaseMethods;
                        
                        onSnapshot(query(collection(window.db, 'shared_regions'), orderBy('order', 'asc')), (s) => {
                            setRegions(s.docs.map(d => ({ ...d.data(), id: d.id })));
                        });

                        onSnapshot(collection(window.db, 'shared_doctors'), (s) => {
                            setDoctors(s.docs.map(d => ({ ...d.data(), id: d.id })));
                        });

                        onSnapshot(query(collection(window.db, 'shared_visits'), orderBy('timestamp', 'desc')), (s) => {
                            setDoctorVisits(s.docs.map(d => ({ ...d.data(), id: d.id })));
                        });

                        onSnapshot(collection(window.db, 'shared_users'), (s) => {
                            const usersList = s.docs.map(d => ({ ...d.data(), id: d.id }));
                            setSystemUsers(usersList);
                            
                            // Eğer sistemde hiç kullanıcı yoksa ilk admın hesabını otomatik buluta kur
                            if (usersList.length === 0) {
                                const { collection, addDoc } = window.FirebaseMethods;
                                addDoc(collection(window.db, 'shared_users'), { username: 'admin', password: 'admin', name: 'Yönetici' });
                            }
                        });

                        setFbReady(true);
                    }
                }, 100);
                return () => clearInterval(checkInterval);
            }, []);

            useEffect(() => {
                if (selectedDoctor && !editingNoteId) {
                    setReminderDate(getTenDaysLaterISO());
                }
            }, [selectedDoctor, editingNoteId]);

            // Giriş Yapma Fonksiyonu
            const handleLoginSubmit = (e) => {
                e.preventDefault();
                const matchedUser = systemUsers.find(u => u.username === loginForm.username && u.password === loginForm.password);
                
                if (matchedUser) {
                    setIsLoggedIn(true);
                    setCurrentUser(matchedUser.name);
                    localStorage.setItem('crm_user_session', matchedUser.name);
                    setLoginForm({ username: '', password: '' });
                } else {
                    alert("❌ Hatalı Kullanıcı Adı veya Şifre!");
                }
            };

            const handleLogoutAction = () => {
                setIsLoggedIn(false);
                setCurrentUser('');
                localStorage.removeItem('crm_user_session');
            };

            const handleDragStart = (id) => setDraggedRegionId(id);
            const handleDrop = async (targetId) => {
                if (!draggedRegionId || draggedRegionId === targetId) return;
                const { doc, updateDoc } = window.FirebaseMethods;
                const draggedIdx = regions.findIndex(r => r.id === draggedRegionId);
                const targetIdx = regions.findIndex(r => r.id === targetId);
                const updated = [...regions];
                const [removed] = updated.splice(draggedIdx, 1);
                updated.splice(targetIdx, 0, removed);
                
                updated.forEach((r, idx) => {
                    updateDoc(doc(window.db, 'shared_regions', r.id), { order: idx });
                });
            };

            const handleAddDoctor = async (e) => {
                e.preventDefault();
                if (!doctorForm.name || !doctorForm.regionId) return;
                const { collection, addDoc } = window.FirebaseMethods;
                
                const docRef = await addDoc(collection(window.db, 'shared_doctors'), {
                    name: doctorForm.name,
                    phone: doctorForm.phone,
                    clinic: doctorForm.clinic,
                    regionId: doctorForm.regionId,
                    timestamp: Date.now()
                });

                if (doctorForm.note) {
                    await addDoc(collection(window.db, 'shared_visits'), {
                        doctorId: docRef.id,
                        text: doctorForm.note + ` [Ekleyen: ${currentUser}]`,
                        rawText: doctorForm.note,
                        date: new Date().toLocaleString('tr-TR'),
                        timestamp: Date.now(),
                        user: currentUser
                    });
                }

                setShowModal(false);
                setDoctorForm({ name: '', phone: '', clinic: '', regionId: '', note: '' });
            };

            const handleAddRegion = async (e) => {
                e.preventDefault();
                if (!regionForm.name) return;
                const { collection, addDoc } = window.FirebaseMethods;
                await addDoc(collection(window.db, 'shared_regions'), { name: regionForm.name, order: regions.length });
                setShowModal(false);
                setRegionForm({ name: '' });
            };

            const handleSaveNote = async (docId) => {
                if (!newNoteText.trim()) return;
                const { collection, addDoc, doc, updateDoc } = window.FirebaseMethods;
                
                let reminderInfo = "";
                let emailRem = reminderEmail || null;
                let emailDt = null;

                if (reminderDate && reminderEmail) {
                    emailDt = new Date(reminderDate).toLocaleString('tr-TR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
                    reminderInfo = ` [M-Hatırlatıcı: ${emailDt} saatinde ${reminderEmail} adresine gönderilecek]`;
                }

                if (editingNoteId) {
                    await updateDoc(doc(window.db, 'shared_visits', editingNoteId), {
                        text: newNoteText + reminderInfo + ` [Düzenleyen: ${currentUser}]`,
                        rawText: newNoteText,
                        emailReminder: emailRem,
                        emailDate: emailDt
                    });
                } else {
                    await addDoc(collection(window.db, 'shared_visits'), {
                        doctorId: docId,
                        text: newNoteText + reminderInfo + ` [Ekleyen: ${currentUser}]`,
                        rawText: newNoteText,
                        date: new Date().toLocaleString('tr-TR'),
                        timestamp: Date.now(),
                        emailReminder: emailRem,
                        emailDate: emailDt,
                        user: currentUser
                    });
                }

                setNewNoteText('');
                setReminderEmail('');
                setEditingNoteId(null);
                setReminderDate(getTenDaysLaterISO());
            };

            const handleStartEditNote = (note) => {
                setEditingNoteId(note.id);
                setNewNoteText(note.rawText || note.text.split(" [M-Hatırlatıcı:")[0]);
                setReminderEmail(note.emailReminder || '');
                if (note.emailDate) {
                    const parts = note.emailDate.split(' ');
                    const dateParts = parts[0].split('.');
                    setReminderDate(`${dateParts[2]}-${dateParts[1]}-${dateParts[0]}T${parts[1]}`);
                } else {
                    setReminderDate('');
                }
            };

            const handleDeleteNote = async (noteId) => {
                if (!confirm("Bu notu silmek istediğinize emin misiniz?")) return;
                const { doc, deleteDoc } = window.FirebaseMethods;
                await deleteDoc(doc(window.db, 'shared_visits', noteId));
                if (editingNoteId === noteId) { setEditingNoteId(null); setNewNoteText(''); setReminderEmail(''); }
            };

            const handleDeleteDoctor = async (id) => {
                if (confirm("Bu hekimi sistemden silmek istediğinize emin misiniz?")) {
                    const { doc, deleteDoc } = window.FirebaseMethods;
                    await deleteDoc(doc(window.db, 'shared_doctors', id));
                    if (selectedDoctor?.id === id) setSelectedDoctor(null);
                }
            };

            const cleanTurkish = (str) => String(str).toLocaleLowerCase('tr-TR').replace(/ğ/g, 'g').replace(/ü/g, 'u').replace(/ş/g, 's').replace(/ı/g, 'i').replace(/ö/g, 'o').replace(/ç/g, 'c');

            const filteredDoctors = useMemo(() => {
                return doctors.filter(doc => {
                    const matchesRegion = activeRegion === 'all' || doc.regionId === activeRegion;
                    const searchTarget = cleanTurkish(doc.name) + " " + cleanTurkish(doc.clinic || '');
                    return matchesRegion && searchTarget.includes(cleanTurkish(searchTerm));
                });
            }, [doctors, activeRegion, searchTerm]);

            if (!fbReady) return <div className="min-h-screen flex items-center justify-center bg-slate-900 text-blue-500 font-black animate-pulse">ORTAK BULUT VERİ TABANINA BAĞLANILIYOR...</div>;

            // 🔑 KULLANICI GİRİŞİ EKRANI TASARIMI (Oturum kapalıyken burası görünür)
            if (!isLoggedIn) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-slate-900 p-4">
                        <div className="w-full max-w-md bg-white rounded-[2.5rem] shadow-2xl p-10 animate-in">
                            <div className="text-center mb-8">
                                <div className="inline-flex bg-blue-600 p-4 rounded-2xl text-white mb-4"><Icon name="activity" size={36} /></div>
                                <h1 className="text-2xl font-black text-slate-800">Seviye Dental <span className="text-blue-600">CRM</span></h1>
                                <p className="text-slate-400 text-[10px] font-bold uppercase tracking-widest mt-1">Ortak Saha Havuzu Girişi</p>
                            </div>
                            <form onSubmit={handleLoginSubmit} className="space-y-4">
                                <input type="text" required className="w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl outline-none font-bold text-slate-700 focus:border-blue-500" placeholder="Kullanıcı Adı (Varsayılan: admin)" value={loginForm.username} onChange={e => setLoginForm({...loginForm, username: e.target.value})} />
                                <input type="password" required className="w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl outline-none font-bold text-slate-700 focus:border-blue-500" placeholder="Şifre (Varsayılan: admin)" value={loginForm.password} onChange={e => setLoginForm({...loginForm, password: e.target.value})} />
                                <button type="submit" className="w-full py-4 bg-blue-600 text-white font-black rounded-2xl shadow-xl hover:bg-blue-700 transition-all text-sm uppercase tracking-wider">Sisteme Giriş Yap</button>
                            </form>
                        </div>
                    </div>
                );
            }

            return (
                <div className="flex flex-col lg:flex-row min-h-screen">
                    <aside className="w-full lg:w-80 bg-slate-900 text-white p-6 flex flex-col shadow-xl shrink-0">
                        <div className="flex items-center gap-3 mb-8 px-2">
                            <div className="bg-blue-600 p-2.5 rounded-2xl text-white"><Icon name="activity" size={24} /></div>
                            <div>
                                <h1 className="text-xl font-extrabold">Seviye<span className="text-blue-500">CRM</span></h1>
                                <p className="text-[10px] text-slate-400 font-bold uppercase tracking-widest">Ortak Saha Havuzu</p>
                            </div>
                        </div>

                        <div className="flex items-center justify-between mb-4 px-2">
                            <h2 className="text-xs font-black uppercase text-slate-400 tracking-wider">Bölgeler / Rotalar</h2>
                            <button onClick={() => { setModalType('region'); setShowModal(true); }} className="p-1 hover:bg-slate-800 rounded-lg text-blue-400">
                                <Icon name="plus" size={18} />
                            </button>
                        </div>

                        <div className="space-y-1 overflow-y-auto flex-1 pr-1 custom-scrollbar">
                            <button onClick={() => setActiveRegion('all')} className={`w-full flex items-center justify-between px-4 py-3 rounded-xl font-bold text-sm ${activeRegion === 'all' ? 'bg-blue-600 text-white' : 'text-slate-400 hover:bg-slate-800'}`}>
                                <span className="flex items-center gap-3"><Icon name="globe" size={18} /> Tüm Hekimler</span>
                                <span className="text-xs bg-slate-800 text-slate-300 px-2 py-0.5 rounded-md">{doctors.length}</span>
                            </button>

                            {regions.map(reg => (
                                <div
                                    key={reg.id}
                                    draggable
                                    onDragStart={() => handleDragStart(reg.id)}
                                    onDragOver={e => e.preventDefault()}
                                    onDrop={() => handleDrop(reg.id)}
                                    onClick={() => setActiveRegion(reg.id)}
                                    className={`w-full flex items-center justify-between px-4 py-3 rounded-xl font-bold text-sm transition-all cursor-grab active:cursor-grabbing ${activeRegion === reg.id ? 'bg-blue-600 text-white' : 'text-slate-400 hover:bg-slate-800'}`}
                                >
                                    <span className="flex items-center gap-3 truncate">
                                        <Icon name="grip-vertical" size={16} className="text-slate-600" />
                                        <span className="truncate">{reg.name}</span>
                                    </span>
                                    <span className="text-xs bg-slate-800 text-slate-300 px-2 py-0.5 rounded-md">{doctors.filter(d => d.regionId === reg.id).length}</span>
                                </div>
                            ))}
                        </div>

                        {/* Oturum Bilgisi ve Çıkış Bölümü */}
                        <div className="mt-auto pt-4 border-t border-slate-800 flex items-center justify-between bg-slate-800/40 p-3 rounded-2xl">
                            <div className="truncate">
                                <p className="text-xs font-black text-white truncate">{currentUser}</p>
                                <p className="text-[8px] text-emerald-400 font-bold uppercase tracking-wider">Oturum Açık</p>
                            </div>
                            <button onClick={handleLogoutAction} className="p-2 text-red-400 hover:bg-red-400/10 rounded-xl"><Icon name="log-out" size={18} /></button>
                        </div>
                    </aside>

                    <div className="mobile-bottom-nav-container md:hidden">
                        <div className="mobile-bottom-nav">
                            <button onClick={() => setActiveRegion('all')} className={`flex-1 flex flex-col items-center gap-1 p-2 rounded-xl text-slate-400 ${activeRegion==='all'?'text-blue-500':''}`}><Icon name="globe" size={18}/> <span className="text-[9px]">Tümü</span></button>
                            {regions.map(r => <button key={r.id} onClick={() => setActiveRegion(r.id)} className={`flex-1 flex flex-col items-center gap-1 p-2 rounded-xl text-slate-400 ${activeRegion===r.id?'text-blue-500':''}`}><Icon name="map-pin" size={18}/> <span className="text-[9px] truncate max-w-[60px]">{r.name.split(' ')[0]}</span></button>)}
                        </div>
                        <button onClick={handleLogoutAction} className="mobile-logout-btn text-red-500 font-black"><Icon name="log-out" size={18} /><span className="text-[9px]">ÇIKIŞ</span></button>
                    </div>

                    <main className="main-content flex-1 p-6 lg:p-10">
                        <header className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-8">
                            <div>
                                <h2 className="text-2xl font-extrabold text-slate-800">{activeRegion === 'all' ? 'Tüm Portföy' : regions.find(r => r.id === activeRegion)?.name}</h2>
                                <p className="text-xs font-bold text-slate-400 uppercase tracking-widest mt-1">Ortak Hekim Kartları & Ziyaret Kayıtları</p>
                            </div>
                            <button onClick={() => { setModalType('doctor'); setDoctorForm({ name: '', phone: '', clinic: '', regionId: activeRegion === 'all' ? '' : activeRegion, note: '' }); setShowModal(true); }} className="px-5 py-3 bg-blue-600 text-white font-bold text-xs uppercase tracking-widest rounded-xl shadow-lg w-full sm:w-auto hover:bg-blue-700">
                                + Yeni Hekim Ekle
                            </button>
                        </header>

                        <div className="mb-6 relative">
                            <input type="text" placeholder="Hekim adı veya klinik aratın (büyük/küçük harf fark etmez)..." className="w-full pl-12 pr-4 py-4 bg-white border border-slate-200 rounded-2xl outline-none focus:ring-2 focus:ring-blue-500 font-medium text-sm shadow-sm" value={searchTerm} onChange={e => setSearchTerm(e.target.value)}/>
                            <div className="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"><Icon name="search" size={20} /></div>
                        </div>

                        <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6">
                            {filteredDoctors.map(doc => {
                                const lastVisit = doctorVisits.find(v => v.doctorId === doc.id);
                                return (
                                    <div key={doc.id} className="bg-white rounded-3xl border border-slate-100 shadow-sm p-6 flex flex-col justify-between hover:shadow-xl transition-all">
                                        <div>
                                            <div className="flex justify-between items-start mb-4">
                                                <div className="bg-blue-50 text-blue-600 p-3 rounded-2xl"><Icon name="user-round" size={24} /></div>
                                                <span className="text-[10px] font-black uppercase bg-slate-100 text-slate-600 px-2.5 py-1 rounded-md">{regions.find(r => r.id === doc.regionId)?.name || 'Bilinmeyen'}</span>
                                            </div>
                                            <h3 className="text-lg font-extrabold text-slate-800 mb-1">{doc.name}</h3>
                                            {doc.clinic && <p className="text-xs font-bold text-slate-400 flex items-center gap-1.5 mb-2"><Icon name="building" size={14} /> {doc.clinic}</p>}
                                            
                                            <div className="bg-slate-50 rounded-xl p-3 border mt-3 text-xs">
                                                <p className="text-[9px] font-black text-slate-400 uppercase mb-1">📍 Son Saha Notu</p>
                                                {lastVisit ? <p className="font-bold text-slate-700">"{lastVisit.rawText || lastVisit.text}"</p> : <p className="text-slate-400 italic">Not alınmamış.</p>}
                                            </div>
                                        </div>
                                        <div className="flex gap-2 mt-4">
                                            <button onClick={() => { setSelectedDoctor(doc); setEditingNoteId(null); setNewNoteText(''); }} className="flex-1 py-2.5 bg-slate-900 text-white font-bold text-xs uppercase rounded-xl hover:bg-slate-800">Detay & Notlar</button>
                                            <button onClick={() => handleDeleteDoctor(doc.id)} className="p-2.5 bg-red-50 text-red-500 rounded-xl hover:bg-red-100"><Icon name="trash-2" size={16}/></button>
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    </main>

                    {/* MODAL: Ortak Hekim Detay / Günlük Notu Ekleme, Düzenleme ve Silme Ekranı */}
                    {selectedDoctor && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-md z-[150] flex items-center justify-center p-4">
                            <div className="bg-white rounded-[2.5rem] shadow-2xl w-full max-w-xl overflow-hidden p-8 animate-in">
                                <div className="flex justify-between items-center mb-6">
                                    <h3 className="text-xl font-extrabold text-slate-900">{selectedDoctor.name} Havuzu</h3>
                                    <button onClick={() => { setSelectedDoctor(null); setEditingNoteId(null); setNewNoteText(''); }} className="p-2 border rounded-xl hover:bg-slate-100"><Icon name="x" size={18} /></button>
                                </div>
                                <div className="space-y-4 max-h-[70vh] overflow-y-auto pr-1 custom-scrollbar">
                                    <div className="space-y-3 bg-slate-50 p-4 rounded-2xl border border-blue-100">
                                        <p className="text-[10px] font-black text-blue-600 uppercase tracking-wider ml-1">
                                            {editingNoteId ? '⚠️ SEÇİLİ NOTU DÜZENLİYORSUNUZ' : '📝 ORTAK HAK HAVUZUNA NOT GİRİŞİ'}
                                        </p>
                                        <textarea placeholder="Ziyaret notunu buraya girin..." className="w-full p-3 border rounded-xl text-xs font-bold h-20 outline-none bg-white focus:border-blue-500" value={newNoteText} onChange={e => setNewNoteText(e.target.value)} />
                                        
                                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-2 pt-1">
                                            <div>
                                                <div className="flex justify-between items-center mb-1 ml-1">
                                                    <label className="block text-[9px] font-black text-slate-400 uppercase tracking-wider">E-Posta Hatırlatma Tarihi & Saati</label>
                                                    <span className="text-[8px] bg-blue-100 text-blue-700 font-extrabold px-1.5 py-0.5 rounded">10 Gün Sonra Otomatik</span>
                                                </div>
                                                <input type="datetime-local" className="w-full p-2 bg-white border rounded-lg text-xs font-bold outline-none text-slate-600 focus:ring-1 focus:ring-blue-500" value={reminderDate} onChange={e => setReminderDate(e.target.value)} />
                                            </div>
                                            <div>
                                                <label className="block text-[9px] font-black text-slate-400 uppercase tracking-wider mb-1 ml-1">Hatırlatılacak E-Posta</label>
                                                <input type="email" placeholder="ornek@mail.com" className="w-full p-2 bg-white border rounded-lg text-xs font-bold outline-none text-slate-600 focus:ring-1 focus:ring-blue-500" value={reminderEmail} onChange={e => setReminderEmail(e.target.value)} />
                                            </div>
                                        </div>

                                        <div className="flex gap-2">
                                            {editingNoteId && (
                                                <button type="button" onClick={() => { setEditingNoteId(null); setNewNoteText(''); setReminderDate(getTenDaysLaterISO()); setReminderEmail(''); }} className="py-2.5 px-4 bg-white border text-slate-500 font-bold text-xs uppercase rounded-xl">İptal</button>
                                            )}
                                            <button type="button" onClick={async () => { await handleSaveNote(selectedDoctor.id); }} className="flex-1 py-2.5 bg-blue-600 text-white font-black text-xs uppercase rounded-xl shadow-md">
                                                {editingNoteId ? 'Notu Güncelle' : 'Notu ve Hatırlatıcıyı Ortak Havuza Kaydet'}
                                            </button>
                                        </div>
                                    </div>
                                    
                                    <div className="space-y-2 pt-4 border-t">
                                        <p className="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-1">Geçmiş Notlar (Ortak Kayıtlar)</p>
                                        {doctorVisits.filter(v => v.doctorId === selectedDoctor.id).map(n => (
                                            <div key={n.id} className="bg-slate-50 p-4 rounded-2xl border relative group/note hover:border-slate-300 transition-all">
                                                <div className="absolute right-3 top-3 flex gap-2">
                                                    <button onClick={() => handleStartEditNote(n)} className={`transition-colors ${editingNoteId === n.id ? 'text-blue-600' : 'text-slate-300 hover:text-blue-500'}`} title="Bu notu düzenle"><Icon name="pencil" size={14} /></button>
                                                    <button onClick={() => handleDeleteNote(n.id)} className="text-slate-300 hover:text-red-500 transition-colors" title="Bu notu günlükten sil"><Icon name="trash-2" size={14} /></button>
                                                </div>
                                                <span className="text-[9px] font-black text-blue-500 block">{n.date}</span>
                                                <p className="text-xs font-bold text-slate-700 mt-1.5 pr-12 leading-relaxed">"{n.rawText || n.text}"</p>
                                                {n.emailReminder && (
                                                    <span className="inline-flex items-center gap-1 mt-2 text-[9px] font-black bg-orange-50 text-orange-700 border border-orange-100 px-2 py-0.5 rounded">
                                                        📬 {n.emailDate} saatinde {n.emailReminder} adresine hatırlatılacak
                                                    </span>
                                                )}
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* MODAL: Yeni Hekim / Bölge Kayıt Formları */}
                    {showModal && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-md z-[150] flex items-center justify-center p-4">
                            <div className="bg-white rounded-[2.5rem] shadow-2xl w-full max-w-md overflow-hidden p-8 animate-in">
                                <div className="flex justify-between items-center mb-6">
                                    <h3 className="text-lg font-extrabold text-slate-900 uppercase">{modalType === 'doctor' ? 'Yeni Hekim Ekle' : 'Yeni Rota Ekle'}</h3>
                                    <button onClick={() => setShowModal(false)} className="p-2 border rounded-xl"><Icon name="x" size={16} /></button>
                                </div>
                                
                                {modalType === 'region' ? (
                                    <form onSubmit={handleAddRegion} className="space-y-4">
                                        <input type="text" required placeholder="Rota Adı (Örn: Isparta Yalvaç)" className="w-full p-4 border rounded-xl font-bold text-sm outline-none" value={regionForm.name} onChange={e => setRegionForm({name: e.target.value})} />
                                        <button type="submit" className="w-full py-4 bg-blue-600 text-white font-black text-xs uppercase rounded-xl">Rotayı Kaydet</button>
                                    </form>
                                ) : (
                                    <form onSubmit={handleAddDoctor} className="space-y-4">
                                        <input type="text" required placeholder="Hekim Adı Soyadı" className="w-full p-4 border rounded-xl font-bold text-sm outline-none" value={doctorForm.name} onChange={e => setDoctorForm({...doctorForm, name: e.target.value})} />
                                        <input type="text" placeholder="Klinik / Hastane" className="w-full p-4 border rounded-xl font-bold text-sm outline-none" value={doctorForm.clinic} onChange={e => setDoctorForm({...doctorForm, clinic: e.target.value})} />
                                        <input type="text" placeholder="Telefon (İsteğe bağlı)" className="w-full p-4 border rounded-xl font-bold text-sm outline-none" value={doctorForm.phone} onChange={e => setDoctorForm({...doctorForm, phone: e.target.value})} />
                                        
                                        <select required className="w-full p-4 border rounded-xl font-bold text-sm text-slate-600 outline-none bg-slate-50" value={doctorForm.regionId} onChange={e => setDoctorForm({...doctorForm, regionId: e.target.value})}>
                                            <option value="">Bölge / Rota Seçin...</option>
                                            {regions.map(r => <option key={r.id} value={r.id}>{r.name}</option>)}
                                        </select>
                                        
                                        <textarea placeholder="İlk ziyaret notu (İsteğe bağlı)..." className="w-full p-4 border rounded-xl font-bold text-xs h-16 outline-none resize-none bg-slate-50" value={doctorForm.note} onChange={e => setDoctorForm({...doctorForm, note: e.target.value})} />
                                        <button type="submit" className="w-full py-4 bg-blue-600 text-white font-black text-xs uppercase rounded-xl">Hekimi Portföye Ekle</button>
                                    </form>
                                )}
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
