<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Seviye Dental CRM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { getAuth } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCQ_qONXThinopzahIic7FEEnyPw2A_ak4",
            authDomain: "seviyedentalcrm.firebaseapp.com",
            projectId: "seviyedentalcrm",
            storageBucket: "seviyedentalcrm.firebasestorage.app",
            messagingSenderId: "68531426376",
            appId: "1:68531426376:web:a1f67a714ba9ab181bf47d",
            measurementId: "G-R4D1M3G241"
        };

        window.app = initializeApp(firebaseConfig);
        window.db = getFirestore(window.app);
        window.auth = getAuth(window.app);
        window.dispatchEvent(new Event('firebase-ready'));
    </script>
</head>
<body class="bg-gray-100">
    <div id="root"></div>

    <script type="text/babel">
        window.addEventListener('firebase-ready', () => {
            const { useState } = React;

            const App = () => {
                const [status, setStatus] = useState("CRM Bağlandı, her şey hazır.");
                
                return (
                    <div className="flex h-screen items-center justify-center bg-white">
                        <div className="text-center">
                            <h1 className="text-3xl font-bold text-blue-600">Seviye Dental CRM</h1>
                            <p className="mt-4 text-gray-600">{status}</p>
                            <p className="mt-2 text-sm text-gray-400">Not: Eğer buradaysan bağlantı başarılıdır.</p>
                        </div>
                    </div>
                );
            };

            const root = ReactDOM.createRoot(document.getElementById('root'));
            root.render(<App />);
        });
    </script>
</body>
</html>
