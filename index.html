<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Seviye Dental - CRM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, collection, onSnapshot, addDoc, query, orderBy, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        const app = initializeApp({ apiKey: "AIzaSyCJJP857pMmLoCc7CMzswHNwTp_TAybMdE", projectId: "webapp-d239c" });
        window.db = getFirestore(app);
        window.FirebaseMethods = { collection, onSnapshot, addDoc, query, orderBy, deleteDoc, doc };
    </script>
</head>
<body class="bg-slate-900 text-white font-sans">
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect } = React;
        const App = () => {
            const [doctors, setDoctors] = useState([]);
            const [logs, setLogs] = useState([]);
            const [visits, setVisits] = useState([]);
            const [activeView, setActiveView] = useState('all');
            const [selectedReport, setSelectedReport] = useState(null);
            const [filterDate, setFilterDate] = useState(new Date().toISOString().split('T')[0]);

            useEffect(() => {
                const { collection, onSnapshot, query, orderBy } = window.FirebaseMethods;
                onSnapshot(collection(window.db, 'shared_doctors'), (s) => setDoctors(s.docs.map(d => ({...d.data(), id: d.id}))));
                onSnapshot(query(collection(window.db, 'shared_logs'), orderBy('timestamp', 'desc')), (s) => setLogs(s.docs.map(d => ({...d.data(), id: d.id}))));
                onSnapshot(collection(window.db, 'shared_visits'), (s) => setVisits(s.docs.map(d => ({...d.data(), id: d.id}))));
            }, []);

            const undo = async (log) => {
                if(log.targetIds?.length) await window.FirebaseMethods.deleteDoc(window.FirebaseMethods.doc(window.db, 'shared_doctors', log.targetIds[0]));
                await window.FirebaseMethods.deleteDoc(window.FirebaseMethods.doc(window.db, 'shared_logs', log.id));
            };

            return (
                <div className="flex h-screen">
                    <aside className="w-64 bg-slate-950 p-6 flex flex-col justify-between border-r border-slate-800">
                        <div className="space-y-6">
                            <h1 className="text-xl font-bold">Seviye CRM</h1>
                            <button onClick={()=>setActiveView('all')} className="block text-slate-400">Tüm Hekimler ({doctors.length})</button>
                            <button onClick={()=>setActiveView('logs')} className="block text-red-400 font-bold">🛡️ Loglar & Undo</button>
                            <button onClick={()=>setActiveView('reports')} className="block text-emerald-400 font-bold">📋 Rapor Geçmişi</button>
                        </div>
                    </aside>
                    <main className="flex-1 p-8 bg-slate-900 overflow-y-auto">
                        {activeView === 'logs' ? (
                            <div className="space-y-2">
                                {logs.map(l => (
                                    <div key={l.id} className="bg-slate-800 p-4 rounded-xl flex justify-between items-center">
                                        <div><p className="text-sm">{l.details}</p><p className="text-[10px] text-slate-500">{l.date}</p></div>
                                        <button onClick={()=>undo(l)} className="bg-red-500/10 text-red-400 px-3 py-1 rounded-lg text-xs font-bold">Geri Al</button>
                                    </div>
                                ))}
                            </div>
                        ) : activeView === 'reports' ? (
                            <div className="space-y-4">
                                <input type="date" value={filterDate} onChange={(e)=>setFilterDate(e.target.value)} className="bg-slate-800 p-2 rounded-lg text-sm border border-slate-700"/>
                                {visits.filter(v => v.date?.includes(filterDate)).map(v => (
                                    <div key={v.id} onClick={()=>setSelectedReport(v)} className="bg-slate-800 p-4 rounded-xl text-sm cursor-pointer hover:bg-slate-700 transition">{v.date} - {v.text.substring(0,50)}...</div>
                                ))}
                            </div>
                        ) : (
                            <div className="grid grid-cols-3 gap-4">
                                {doctors.map(d => <div key={d.id} className="bg-white text-slate-800 p-4 rounded-xl font-bold">{d.name}</div>)}
                            </div>
                        )}
                    </main>
                    {selectedReport && (
                        <div className="fixed inset-0 bg-black/80 flex items-center justify-center p-10" onClick={()=>setSelectedReport(null)}>
                            <div className="bg-white text-slate-900 p-8 rounded-2xl w-full max-w-2xl max-h-[80vh] overflow-y-auto">
                                <h3 className="text-xl font-bold mb-4">{selectedReport.date} Rapor Detayı</h3>
                                <p>{selectedReport.text}</p>
                            </div>
                        </div>
                    )}
                </div>
            );
        };
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
