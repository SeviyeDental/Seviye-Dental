                                                        <input type="checkbox" className="w-4 h-4 text-purple-600 rounded" 
                                                            checked={formData.sysPerms.includes('all')}
                                                            onChange={e => {
                                                                if(e.target.checked) setFormData({...formData, sysPerms: ['all']});
                                                                else setFormData({...formData, sysPerms: []});
                                                            }}
                                                        />
                                                        <span className="text-[10px] font-black text-purple-700 uppercase">TÜM YETKİLERİ VER</span>
                                                    </label>
                                                </div>
                                                {!formData.sysPerms.includes('all') && (
                                                    <div className="grid grid-cols-2 gap-3">
                                                        {PERMISSIONS.map(p => (
                                                            <label key={p.id} className="flex items-center gap-2 p-3 bg-white border rounded-xl cursor-pointer hover:bg-slate-50">
                                                                <input type="checkbox" className="w-4 h-4 text-blue-600 rounded"
                                                                    checked={formData.sysPerms.includes(p.id)}
                                                                    onChange={e => {
                                                                        const current = formData.sysPerms.filter(x => x !== 'all');
                                                                        if(e.target.checked) setFormData({...formData, sysPerms: [...current, p.id]});
                                                                        else setFormData({...formData, sysPerms: current.filter(x => x !== p.id)});
                                                                    }}
                                                                />
                                                                <span className="text-xs font-bold text-slate-700">{p.label}</span>
                                                            </label>
                                                        ))}
                                                    </div>
                                                )}
                                            </div>
                                        </div>
                                    )}

                                    {modalType === 'warehouse' && (
                                        <InputField label="Depo / Şube İsmi" value={formData.name} onChange={v => setFormData({...formData, name: v})} placeholder="Örn: Merkez Depo" />
                                    )}

                                    {modalType === 'transfer' && (
                                        <div className="space-y-5">
                                            <div className="p-6 bg-blue-50 border border-blue-100 rounded-[2.5rem]">
                                                <p className="text-xs font-black text-blue-600 mb-1">Ürün:</p>
                                                <p className="font-black text-slate-800">{editItem?.name}</p>
                                            </div>
                                            <div className="grid grid-cols-2 gap-4">
                                                <div>
                                                    <label className="text-[10px] font-black text-slate-400 uppercase mb-2 ml-2">Nereden:</label>
                                                    <select className="w-full p-4 bg-slate-50 border rounded-2xl font-bold" value={formData.fromDepo} onChange={e => setFormData({...formData, fromDepo: e.target.value})}><option value="">Seçiniz</option>{warehouses.map(w => <option key={w.id} value={w.name}>{w.name}</option>)}</select>
                                                </div>
                                                <div>
                                                    <label className="text-[10px] font-black text-slate-400 uppercase mb-2 ml-2">Nereye:</label>
                                                    <select className="w-full p-4 bg-slate-50 border rounded-2xl font-bold" value={formData.toDepo} onChange={e => setFormData({...formData, toDepo: e.target.value})}><option value="">Seçiniz</option>{warehouses.map(w => <option key={w.id} value={w.name}>{w.name}</option>)}</select>
                                                </div>
                                            </div>
                                            <InputField label="Miktar" type="number" value={formData.transferQty} onChange={v => setFormData({...formData, transferQty: v})} />
                                            <button onClick={handleTransfer} className="w-full py-5 bg-blue-600 text-white font-black rounded-3xl uppercase tracking-widest text-xs shadow-xl">TRANSFERİ ONAYLA</button>
                                        </div>
                                    )}

                                    {modalType === 'surgery' && (
                                        <div className="space-y-4">
                                            <InputField label="İşlem Adı" value={formData.surgeryType} onChange={v => setFormData({...formData, surgeryType: v})} />
                                            <select className="w-full p-4 bg-slate-50 border rounded-2xl font-bold text-slate-600" value={formData.doctorId} onChange={e => setFormData({...formData, doctorId: e.target.value})}><option value="">Hekim Seçin</option>{doctors.map(d => <option key={d.id} value={d.id}>{d.name}</option>)}</select>
                                            <InputField label="Tarih" type="date" value={formData.surgeryDate} onChange={v => setFormData({...formData, surgeryDate: v})} />
                                            <TextAreaField label="Ameliyat Notları" value={formData.note} onChange={v => setFormData({...formData, note: v})} />
                                        </div>
                                    )}

                                    {modalType === 'consumption' && (
                                        <div className="space-y-4">
                                            <div className="bg-slate-50 p-5 rounded-[2.5rem] border-2 border-dashed border-slate-200">
                                                <div className="flex justify-between items-center mb-4">
                                                    <p className="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-2">Çıkış Yapılacak Ürünler</p>
                                                    <input type="text" placeholder="Ürünlerde Ara..." className="p-3 px-4 rounded-xl text-xs font-bold border outline-none w-48 bg-white" value={consumptionSearch} onChange={e => setConsumptionSearch(e.target.value)} />
                                                </div>
                                                
                                                {formData.consumptionProducts.map((cp, idx) => {
                                                    const selectedItem = normalizedStockItems.find(i => i.id === cp.productId);
                                                    return (
                                                    <div key={cp.id} className="flex flex-col gap-3 bg-white p-4 rounded-[1.5rem] mb-4 border border-slate-200 shadow-sm">
                                                        <div className="flex flex-col md:flex-row gap-3">
                                                            <div className="flex-1">
                                                                <label className="block text-[9px] font-black text-slate-400 uppercase tracking-widest mb-1 ml-2">Kategori</label>
                                                                <select className="w-full p-3 bg-slate-50 border rounded-xl font-bold text-sm outline-none" value={cp.categoryId || ''} onChange={e => {
                                                                    const newProds = [...formData.consumptionProducts];
                                                                    newProds[idx].categoryId = e.target.value; newProds[idx].productId = '';
                                                                    setFormData({...formData, consumptionProducts: newProds});
                                                                }}>
                                                                    <option value="">Tümü</option>
                                                                    {sortedCategories.map(cat => <option key={cat.id} value={cat.id}>{cat.name}</option>)}
                                                                </select>
                                                            </div>
                                                            <div className="flex-[1.5]">
                                                                <label className="block text-[9px] font-black text-slate-400 uppercase tracking-widest mb-1 ml-2">Ürün Seçimi</label>
                                                                <select className="w-full p-3 bg-slate-50 border rounded-xl font-bold text-sm text-slate-700 outline-none" value={cp.productId} onChange={e => {
                                                                    const newProds = [...formData.consumptionProducts];
                                                                    newProds[idx].productId = e.target.value;
                                                                    setFormData({...formData, consumptionProducts: newProds});
                                                                }}>
                                                                    <option value="">Listeden Seçin...</option>
                                                                    {normalizedStockItems.filter(i => 
                                                                        (!cp.categoryId || i.categoryId === cp.categoryId) && 
                                                                        (i.id === cp.productId || normalizeTr(i.name).includes(normalizeTr(consumptionSearch)))
                                                                    ).map(i => <option key={i.id} value={i.id}>{i.name} (Toplam: {i.count})</option>)}
                                                                </select>
                                                            </div>
                                                        </div>

                                                        {selectedItem && (
                                                            <div className="bg-slate-50 p-3 rounded-xl border border-slate-200">
                                                                <div className="flex flex-wrap gap-2">
                                                                    {warehouses.map(w => <span key={w.id} className="text-xs px-2 py-1 bg-white rounded border font-bold">{w.name}: {selectedItem.counts[w.name] || 0}</span>)}
                                                                </div>
                                                            </div>
                                                        )}

                                                        <div className="flex gap-3 items-end">
                                                            <div className="flex-[1.5]">
                                                                <label className="block text-[9px] font-black text-slate-400 uppercase tracking-widest mb-1 ml-2">Çıkış Yapılacak Depo</label>
                                                                <select className="w-full p-3 bg-slate-50 border rounded-xl font-bold text-sm text-blue-700 outline-none" value={cp.sourceDepo || ''} onChange={e => {
                                                                    const newProds = [...formData.consumptionProducts];
                                                                    newProds[idx].sourceDepo = e.target.value;
                                                                    setFormData({...formData, consumptionProducts: newProds});
                                                                }}>
                                                                    <option value="">Depo Seçiniz...</option>
                                                                    {warehouses.map(w => <option key={w.id} value={w.name}>{w.name}</option>)}
                                                                </select>
                                                            </div>
                                                            <div className="flex-1">
                                                                <label className="block text-[9px] font-black text-slate-400 uppercase tracking-widest mb-1 ml-2">Adet</label>
                                                                <input type="number" min="1" className="w-full p-3 bg-slate-50 border rounded-xl font-bold text-sm text-center outline-none" value={cp.quantity} onChange={e => {
                                                                    const newProds = [...formData.consumptionProducts];
                                                                    newProds[idx].quantity = e.target.value;
                                                                    setFormData({...formData, consumptionProducts: newProds});
                                                                }} />
                                                            </div>
                                                        </div>
                                                    </div>
                                                )})}
                                                <button onClick={() => setFormData({...formData, consumptionProducts: [...formData.consumptionProducts, { id: Date.now(), categoryId: '', productId: '', quantity: 1, sourceDepo: '' }]})} className="w-full py-4 mt-2 bg-blue-50 text-blue-600 rounded-2xl font-black text-[10px] uppercase tracking-widest border border-dashed border-blue-100">+ Başka Bir Ürün Daha Ekle</button>
                                            </div>

                                            <div className="grid grid-cols-1 gap-4 mt-6">
                                                <div className="flex justify-between items-center bg-slate-50 border border-slate-100 rounded-t-[2rem] p-3 px-5 border-b-0">
                                                    <label className="text-[10px] font-black text-slate-400 uppercase tracking-widest">Hasta Seçimi</label>
                                                    <input type="text" placeholder="Hastada ara..." className="p-2 px-4 rounded-xl text-xs font-bold border outline-none w-48 bg-white" value={patientSearch} onChange={e => setPatientSearch(e.target.value)} />
                                                </div>
                                                <select className="p-5 bg-slate-50 border rounded-b-[2rem] outline-none font-black text-sm text-slate-600 -mt-4 border-t-0" value={formData.patientId} onChange={e => setFormData({...formData, patientId: e.target.value})}>
                                                    <option value="">Listeden Hasta Seçin</option><option value="new_patient" className="text-blue-600 font-black">+ YENİ HASTA EKLE</option>
                                                    {patients.filter(p => !patientSearch || normalizeTr(p.name).includes(normalizeTr(patientSearch))).map(p => <option key={p.id} value={p.id}>{p.name}</option>)}
                                                </select>
                                            </div>

                                            <div className="grid grid-cols-2 gap-4">
                                                <select className="w-full p-5 bg-slate-50 border rounded-[2rem] outline-none font-black text-sm text-slate-600" value={formData.doctorId} onChange={e => setFormData({...formData, doctorId: e.target.value})}><option value="">Cerrahi Hekim</option>{doctors.map(d => <option key={d.id} value={d.id}>{d.name}</option>)}</select>
                                                <select className="w-full p-5 bg-slate-50 border rounded-[2rem] outline-none font-black text-sm text-slate-600" value={formData.prosDoctorId} onChange={e => setFormData({...formData, prosDoctorId: e.target.value})}><option value="">Protez Hekimi</option>{doctors.map(d => <option key={d.id} value={d.id}>{d.name}</option>)}</select>
                                            </div>

                                            <div className="grid grid-cols-2 gap-4">
                                                <InputField label="İşlem Tarihi ve Saati" type="datetime-local" value={formData.transactionDate} onChange={v => setFormData({...formData, transactionDate: v})} />
                                                <InputField label="LOT Numarası" value={formData.lotNo} onChange={v => setFormData({...formData, lotNo: v})} placeholder="Örn: 123456" />
                                            </div>
                                        </div>
                                    )}

                                    {modalType === 'patient' && (
                                        <div className="space-y-4">
                                            <InputField label="Hasta Adı Soyadı" value={formData.name || ''} onChange={v => setFormData({...formData, name: v})} placeholder="Örn: Erbil Yılmaz" />
                                            <div className="grid grid-cols-2 gap-4">
                                                <InputField label="TC Kimlik No" value={formData.tcNo || ''} onChange={v => setFormData({...formData, tcNo: v})} />
                                                <InputField label="Telefon" value={formData.phone || ''} onChange={v => setFormData({...formData, phone: v})} />
                                            </div>
                                            <TextAreaField label="Hastaya Özel Not / Açıklama" value={formData.note || ''} onChange={v => setFormData({...formData, note: v})} />
                                        </div>
                                    )}

                                    {['product', 'category', 'doctor'].includes(modalType) && (
                                        <div className="space-y-5">
                                            <InputField label={modalType === 'category' ? 'Kategori Adı' : 'İsim / Başlık'} value={formData.name || ''} onChange={v => setFormData({...formData, name: v})} />
                                            {modalType === 'doctor' && (
                                                <InputField label="Uzmanlık Alanı" value={formData.detail || ''} onChange={v => setFormData({...formData, detail: v})} placeholder="Örn: Diş Hekimi" />
                                            )}
                                            {modalType === 'product' && (
                                                <div className="space-y-4">
                                                    <InputField label="Kod" value={formData.productCode || ''} onChange={v => setFormData({...formData, productCode: v})} />
                                                    <select className="w-full p-5 bg-slate-50 border rounded-[2rem] outline-none font-black text-sm text-slate-600" value={formData.categoryId || ''} onChange={e => setFormData({...formData, categoryId: e.target.value})}><option value="">Kategori Seçin</option>{sortedCategories.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}</select>
                                                    <div className="bg-slate-50 p-6 rounded-[2.5rem] border-2 border-dashed border-slate-200 mt-4">
                                                        <p className="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-4">Şube Stok Miktarları</p>
                                                        <div className="grid grid-cols-2 gap-4">
                                                            {warehouses.map(w => (
                                                                <div key={w.id}>
                                                                    <label className="text-[9px] font-black text-slate-500 uppercase ml-2">{w.name}:</label>
                                                                    <input type="number" className="w-full p-3 bg-white border rounded-xl font-bold" value={formData.counts[w.name] || ''} onChange={e => setFormData({...formData, counts: {...formData.counts, [w.name]: parseInt(e.target.value) || 0}})} />
                                                                </div>
                                                            ))}
                                                        </div>
                                                    </div>
                                                </div>
                                            )}
                                            <TextAreaField label="Açıklama / Notlar" value={formData.note || ''} onChange={v => setFormData({...formData, note: v})} />
                                        </div>
                                    )}

                                </div>
                                <div className="p-10 bg-slate-50/50 flex gap-4">
                                    <button onClick={() => { setShowModal(false); setEditItem(null); resetForm(); }} className="flex-1 py-5 bg-white text-slate-400 font-black rounded-3xl border text-[10px] uppercase tracking-widest">İptal</button>
                                    <button onClick={handleSave} className="flex-1 py-5 bg-blue-600 text-white font-black rounded-3xl shadow-lg text-[10px] uppercase tracking-widest">KAYBET</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const InputField = ({ label, type = "text", value, onChange, placeholder = "..." }) => (
            <div>
                <label className="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2 ml-2">{label}</label>
                <input type={type} className="w-full p-5 bg-slate-50 border-2 border-slate-100 rounded-3xl outline-none focus:border-blue-500 transition-all font-bold placeholder-slate-300" value={value || ''} onChange={e => onChange(e.target.value)} placeholder={placeholder} />
            </div>
        );

        const TextAreaField = ({ label, value, onChange }) => (
            <div>
                <label className="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2 ml-2">{label}</label>
                <textarea className="w-full p-5 bg-slate-50 border-2 border-slate-100 rounded-3xl outline-none focus:border-blue-500 transition-all font-bold h-32 resize-none" value={value || ''} onChange={e => onChange(e.target.value)} />
            </div>
        );

        const StatCard = ({ title, value, icon, color }) => {
            const colors = { blue: 'bg-blue-500/10 text-blue-500', purple: 'bg-purple-500/10 text-purple-500', orange: 'bg-orange-500/10 text-orange-500', emerald: 'bg-emerald-500/10 text-emerald-500' };
            return (
                <div className="bg-white p-8 rounded-[2.5rem] shadow-sm border border-slate-100 flex items-center justify-between transition-all hover:shadow-lg">
                    <div>
                        <p className="text-slate-400 text-[10px] font-black uppercase tracking-widest mb-1">{title}</p>
                        <h3 className="text-3xl font-black text-slate-800 tracking-tighter">{value}</h3>
                    </div>
                    <div className={`${colors[color]} p-4 rounded-2xl`}><Icon name={icon} size={28} /></div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
